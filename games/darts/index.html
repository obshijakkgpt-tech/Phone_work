<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Дротики в человечка</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { margin:0; overflow:hidden; background:#000; touch-action:none; user-select:none; }
canvas { position:fixed; top:0; left:0; display:block; }
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
(function () {
"use strict";

// ─── CANVAS ─────────────────────────────────────────────────
const cv = document.getElementById("g");
const cx = cv.getContext("2d");
const W = 480, H = 300;
function resize(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
window.addEventListener("resize", resize); resize();
function canvasXY(clientX, clientY){ return { x: clientX*W/cv.width, y: clientY*H/cv.height }; }

// ─── CONSTANTS ──────────────────────────────────────────────
const OX = 64, OY = 232;          // рука метателя (старт дротика)
const GR = 0.17, MAXV = 17;
const DARTS = 8;
const AY = 92;                    // верх головы (по вертикали фикс.)
const WALLX = 432;                // стена за человечком

// ─── STATE ──────────────────────────────────────────────────
let gstate, fr, score, dartsLeft, best=0;
let dart, aiming, aimSX, aimSY, aimCX, aimCY, stuck, pops, man, hintA;

function reset(){
  gstate = "play"; fr = 0; score = 0; dartsLeft = DARTS;
  dart = null; aiming = false; stuck = []; pops = [];
  man = { sway: 22, react:0, reactTxt:"", eyeHit:[false,false], hideT:0 };
  hintA = 4*60;
}
function manX(){ return 340 + Math.sin(fr*0.024)*man.sway; }
function manY(){ return AY + Math.sin(fr*0.05)*3; }

// ─── ВВОД (тянешь — целишься с дугой, отпускаешь — бросок) ──
function throwDart(vx, vy){
  const sp = Math.hypot(vx,vy);
  if (sp > MAXV){ vx = vx/sp*MAXV; vy = vy/sp*MAXV; }
  dart = { x:OX, y:OY, vx, vy, ang:Math.atan2(vy,vx) };
}
function release(){
  if (!aiming) return; aiming = false;
  if (gstate !== "play" || dart || dartsLeft <= 0) return;
  const vx = (aimSX - aimCX) * 0.17, vy = (aimSY - aimCY) * 0.17;
  if (Math.hypot(vx,vy) < 1.5) return;          // слишком слабый рывок — не бросаем
  throwDart(vx, vy);
}

document.addEventListener("touchstart", e => { e.preventDefault();
  const p = canvasXY(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  if (gstate==="play"){ if (!dart && dartsLeft>0){ aiming=true; aimSX=aimCX=p.x; aimSY=aimCY=p.y; } }
  else if (hitBtn(p.x,p.y)) reset();
}, {passive:false});
document.addEventListener("touchmove", e => { e.preventDefault();
  const p = canvasXY(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  if (aiming){ aimCX=p.x; aimCY=p.y; }
}, {passive:false});
document.addEventListener("touchend", e => { e.preventDefault(); release(); }, {passive:false});

cv.addEventListener("mousedown", e => { const p=canvasXY(e.clientX,e.clientY);
  if (gstate==="play"){ if(!dart&&dartsLeft>0){ aiming=true; aimSX=aimCX=p.x; aimSY=aimCY=p.y; } }
  else if (hitBtn(p.x,p.y)) reset(); });
cv.addEventListener("mousemove", e => { if(aiming){ const p=canvasXY(e.clientX,e.clientY); aimCX=p.x; aimCY=p.y; } });
cv.addEventListener("mouseup", () => release());
function hitBtn(x,y){ return x>W/2-85 && x<W/2+85 && y>H/2+34 && y<H/2+80; }

// ─── ПОПАДАНИЯ ──────────────────────────────────────────────
// попадание в силуэт: зона по высоте точки пересечения (как на дартборде)
function resolveBand(d, ax, ay){
  const dy = d.y - ay;
  let pts, txt, col;
  if (dy >= 6 && dy <= 17){ pts=100; txt="ГЛАЗ! 100"; col="#ff5252"; man.eyeHit[d.x<ax?0:1]=true; }
  else if (dy >= -4 && dy <= 28){ pts=50; txt="голова +50"; col="#ffd54f"; }
  else if (dy >= 72 && dy <= 90){ pts=75; txt="ОЙ! +75"; col="#ff8f00"; man.hideT=70; }
  else if (dy >= 28 && dy <= 72){ pts=25; txt="торс +25"; col="#9ccc65"; }
  else { pts=10; txt="нога +10"; col="#80cbc4"; }
  score += pts;
  man.react = 16; man.reactTxt = pts>=75 ? (pts===100?"А-А!":"ОЙ!") : "Ай!";
  pops.push({ x:d.x, y:d.y, txt, col, life:50 });
  stuck.push({ x:d.x, y:d.y, ang:d.ang, onMan:true, ox:d.x-ax, oy:d.y-ay });
}
function resolveMiss(d){
  const px = Math.min(d.x, WALLX), py = Math.min(d.y, 250);
  pops.push({ x:px, y:py-10, txt:"МИМО", col:"#b0bec5", life:50 });
  stuck.push({ x:px, y:py, ang:d.ang, onMan:false, ox:0, oy:0 });
}

// ─── UPDATE ─────────────────────────────────────────────────
function update(){
  fr++;
  if (hintA>0) hintA--;
  if (man.react>0) man.react--;
  if (man.hideT>0) man.hideT--;
  for (const p of pops){ p.y -= 0.5; p.life--; }
  pops = pops.filter(p=>p.life>0);
  // прилипшие к человечку дротики едут вместе с ним
  const ax=manX(), ay=manY();
  for (const s of stuck){ if (s.onMan){ s.x = ax+s.ox; s.y = ay+s.oy; } }

  if (gstate!=="play") return;

  if (dart){
    dart.vy += GR; dart.x += dart.vx; dart.y += dart.vy; dart.ang = Math.atan2(dart.vy,dart.vx);
    const ax2 = manX(), ay2 = manY(), planeX = ax2 - 14;
    let done = false;
    if (dart.x >= planeX && (dart.y - ay2) >= -4 && (dart.y - ay2) <= 124){
      resolveBand(dart, ax2, ay2); done = true;          // воткнулся в человечка
    } else if (dart.x >= WALLX || dart.y >= 250 || dart.x > W+10){
      resolveMiss(dart); done = true;                    // мимо — в стену/пол
    }
    if (done){
      dart = null; dartsLeft--;
      if (dartsLeft <= 0){ gstate = "over"; if (score>best) best=score; }
    }
  }
}

// ─── HELPERS ────────────────────────────────────────────────
function rr(x,y,w,h,r){ const m=Math.min(r,w/2,h/2); cx.beginPath();
  cx.moveTo(x+m,y); cx.lineTo(x+w-m,y); cx.arcTo(x+w,y,x+w,y+h,m);
  cx.lineTo(x+w,y+h-m); cx.arcTo(x+w,y+h,x,y+h,m);
  cx.lineTo(x+m,y+h); cx.arcTo(x,y+h,x,y,m);
  cx.lineTo(x,y+m); cx.arcTo(x,y,x+w,y,m); cx.closePath(); }

function drawDartShape(x,y,ang,scale){
  cx.save(); cx.translate(x,y); cx.rotate(ang); cx.scale(scale,scale);
  cx.fillStyle="#37474f"; cx.fillRect(-14,-1,18,2);            // древко
  cx.fillStyle="#9e9e9e"; cx.beginPath(); cx.moveTo(4,0); cx.lineTo(10,-2); cx.lineTo(12,0); cx.lineTo(10,2); cx.closePath(); cx.fill(); // остриё
  cx.fillStyle="#e53935"; cx.beginPath(); cx.moveTo(-14,0); cx.lineTo(-20,-4); cx.lineTo(-18,0); cx.lineTo(-20,4); cx.closePath(); cx.fill(); // оперение
  cx.fillStyle="#1e88e5"; cx.beginPath(); cx.moveTo(-11,0); cx.lineTo(-16,-3); cx.lineTo(-15,0); cx.lineTo(-16,3); cx.closePath(); cx.fill();
  cx.restore();
}

// ─── ОТРИСОВКА ──────────────────────────────────────────────
function drawBG(){
  const g = cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#e7d9c4"); g.addColorStop(1,"#cdbb9e");
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // деревянная стена-щит за человечком
  cx.fillStyle="#c9a86a"; cx.fillRect(WALLX-6,0,W-WALLX+6,H);
  cx.strokeStyle="rgba(0,0,0,0.12)"; cx.lineWidth=1;
  for (let y=10;y<H;y+=22){ cx.beginPath(); cx.moveTo(WALLX-6,y); cx.lineTo(W,y+6); cx.stroke(); }
  // пол
  cx.fillStyle="#a1887f"; cx.fillRect(0,250,W,H-250);
  cx.fillStyle="#8d6e63"; cx.fillRect(0,250,W,4);
  // линия метателя
  cx.strokeStyle="rgba(0,0,0,0.18)"; cx.setLineDash([5,5]); cx.lineWidth=2;
  cx.beginPath(); cx.moveTo(OX,40); cx.lineTo(OX,250); cx.stroke(); cx.setLineDash([]);
}

function drawMan(){
  const ax = manX(), ay = manY();
  const fl = man.react>0 ? Math.sin(fr*0.9)*2 : 0;     // вздрагивание
  cx.save(); cx.translate(ax+fl, ay);

  // ноги
  cx.strokeStyle="#f0c39a"; cx.lineWidth=7; cx.lineCap="round";
  cx.beginPath(); cx.moveTo(-4,74); cx.lineTo(-7,120); cx.moveTo(4,74); cx.lineTo(7,120); cx.stroke();
  // тело
  cx.fillStyle="#f3c89e"; rr(-12,28,24,48,10); cx.fill();
  // руки (вниз, при попадании — вверх «ой»)
  cx.strokeStyle="#f0c39a"; cx.lineWidth=6;
  if (man.hideT>0){ // прикрывается
    cx.beginPath(); cx.moveTo(-9,34); cx.lineTo(-2,70); cx.moveTo(9,34); cx.lineTo(2,70); cx.stroke();
  } else if (man.react>0){
    cx.beginPath(); cx.moveTo(-9,34); cx.lineTo(-20,18); cx.moveTo(9,34); cx.lineTo(20,18); cx.stroke();
  } else {
    cx.beginPath(); cx.moveTo(-9,34); cx.lineTo(-20,58); cx.moveTo(9,34); cx.lineTo(20,58); cx.stroke();
  }
  cx.fillStyle="#f0c39a"; // кисти
  // фиговый листок (скромность)
  cx.fillStyle="#43a047"; cx.beginPath(); cx.ellipse(0,78,7,9,0,0,Math.PI*2); cx.fill();
  cx.strokeStyle="#2e7d32"; cx.lineWidth=1; cx.beginPath(); cx.moveTo(0,72); cx.lineTo(0,86); cx.stroke();
  // голова
  cx.fillStyle="#f3c89e"; cx.beginPath(); cx.arc(0,14,15,0,Math.PI*2); cx.fill();
  // уши
  cx.beginPath(); cx.arc(-15,14,3,0,Math.PI*2); cx.arc(15,14,3,0,Math.PI*2); cx.fill();
  // глаза (цель — максимум очков)
  for (const [i,ex] of [[0,-5],[1,5]]){
    if (man.eyeHit[i]){ cx.strokeStyle="#b71c1c"; cx.lineWidth=2;
      cx.beginPath(); cx.moveTo(ex-3,8); cx.lineTo(ex+3,14); cx.moveTo(ex+3,8); cx.lineTo(ex-3,14); cx.stroke(); }
    else { cx.fillStyle="#fff"; cx.beginPath(); cx.arc(ex,11,4.4,0,Math.PI*2); cx.fill();
      cx.fillStyle="#1b1b1b"; cx.beginPath(); cx.arc(ex+(Math.sin(fr*0.03)*1),11,2.1,0,Math.PI*2); cx.fill(); }
  }
  // мишень-подсветка глаз
  cx.strokeStyle="rgba(255,0,0,0.25)"; cx.lineWidth=1;
  cx.beginPath(); cx.arc(-5,11,7,0,Math.PI*2); cx.arc(5,11,7,0,Math.PI*2); cx.stroke();
  // рот
  cx.strokeStyle="#7a3b1a"; cx.lineWidth=1.6;
  if (man.react>0){ cx.beginPath(); cx.arc(0,20,3,0,Math.PI*2); cx.stroke(); }   // «ой» рот
  else { cx.beginPath(); cx.arc(0,19,3,0.1,Math.PI-0.1); cx.stroke(); }
  cx.restore();

  // пьедестал
  cx.fillStyle="#6d4c41"; cx.fillRect(ax-26,213,52,8);
  cx.fillStyle="#5d4037"; cx.fillRect(ax-20,221,40,30);

  // реплика при попадании
  if (man.react>0 && man.reactTxt){
    cx.fillStyle="#fff"; rr(ax+16, ay-6, 42, 18, 6); cx.fill();
    cx.fillStyle="#c62828"; cx.font="bold 12px sans-serif"; cx.textAlign="center";
    cx.fillText(man.reactTxt, ax+37, ay+7);
  }
}

function drawAim(){
  if (!aiming) return;
  let vx=(aimSX-aimCX)*0.17, vy=(aimSY-aimCY)*0.17;
  const sp=Math.hypot(vx,vy); if(sp>MAXV){vx=vx/sp*MAXV;vy=vy/sp*MAXV;}
  // линия натяжения
  cx.strokeStyle="rgba(0,0,0,0.25)"; cx.lineWidth=2; cx.setLineDash([4,4]);
  cx.beginPath(); cx.moveTo(OX,OY); cx.lineTo(OX-vx*2, OY-vy*2); cx.stroke(); cx.setLineDash([]);
  // дуга траектории
  let px=OX,py=OY,tvx=vx,tvy=vy;
  cx.fillStyle="rgba(255,255,255,0.8)";
  for (let i=0;i<34;i++){ px+=tvx; py+=tvy; tvy+=GR;
    if (i%2===0){ cx.beginPath(); cx.arc(px,py,2,0,Math.PI*2); cx.fill(); }
    if (px>WALLX||py>252) break;
  }
  // сила
  cx.fillStyle="#fff"; cx.font="10px sans-serif"; cx.textAlign="left";
  cx.fillText("сила "+Math.round(sp/MAXV*100)+"%", OX-10, OY+24);
}

function drawThrower(){
  // рука метателя с дротиком наготове
  cx.fillStyle="#5d4037"; cx.beginPath(); cx.arc(OX-6,OY+8,10,0,Math.PI*2); cx.fill();
  if (!dart && dartsLeft>0 && gstate==="play"){
    let ang=-0.5;
    if (aiming){ let vx=(aimSX-aimCX), vy=(aimSY-aimCY); if(Math.hypot(vx,vy)>3) ang=Math.atan2(vy,vx); }
    drawDartShape(OX, OY, ang, 1);
  }
}

// ─── HUD / ОВЕРЛЕИ ──────────────────────────────────────────
function drawHUD(){
  cx.fillStyle="rgba(0,0,0,0.4)"; cx.fillRect(0,0,W,24);
  cx.fillStyle="#ffeb3b"; cx.font="bold 15px monospace"; cx.textAlign="left";
  cx.fillText(score+" очков", 8, 17);
  // оставшиеся дротики
  cx.textAlign="right";
  for (let i=0;i<dartsLeft;i++) drawDartShape(W-14-i*16, 12, 0, 0.55);
  // попапы
  cx.textAlign="center"; cx.font="bold 12px sans-serif";
  for (const p of pops){ cx.globalAlpha=Math.min(1,p.life/30); cx.fillStyle=p.col; cx.fillText(p.txt, p.x, p.y); }
  cx.globalAlpha=1;

  if (hintA>0 && gstate==="play"){
    const a=Math.min(1,hintA/60); cx.save(); cx.globalAlpha=a;
    cx.fillStyle="rgba(0,0,0,0.5)"; cx.fillRect(0,H-22,W,22);
    cx.fillStyle="#fff"; cx.font="10px sans-serif"; cx.textAlign="center";
    cx.fillText("Тяни назад и отпусти — бросок. Целься в глаза — 100 очков!", W/2, H-7);
    cx.restore();
  }
}
function drawBtn(label){
  cx.fillStyle="#43a047"; rr(W/2-85,H/2+34,170,46,23); cx.fill();
  cx.fillStyle="#fff"; cx.font="bold 18px sans-serif"; cx.textAlign="center";
  cx.fillText(label, W/2, H/2+63);
}
function drawMenu(){
  drawBG(); drawMan();
  cx.fillStyle="rgba(0,0,0,0.45)"; cx.fillRect(0,0,W,H);
  cx.fillStyle="#ffeb3b"; cx.font="bold 26px sans-serif"; cx.textAlign="center";
  cx.fillText("ДРОТИКИ", W/2, H/2-58);
  cx.fillStyle="#fff"; cx.font="13px sans-serif";
  cx.fillText("Метай дротики в человечка.", W/2, H/2-30);
  cx.fillStyle="#ff8a80"; cx.font="13px sans-serif";
  cx.fillText("Попади в ГЛАЗ — максимум, 100 очков!", W/2, H/2-10);
  cx.fillStyle="#b0bec5"; cx.font="11px sans-serif";
  cx.fillText("голова 50 · торс 25 · руки/ноги 10 · "+DARTS+" дротиков", W/2, H/2+10);
  drawBtn("▶  МЕТАТЬ");
}
function drawOver(){
  cx.fillStyle="rgba(0,0,0,0.72)"; cx.fillRect(0,0,W,H);
  cx.fillStyle="#ffeb3b"; cx.font="bold 22px sans-serif"; cx.textAlign="center";
  cx.fillText("ДРОТИКИ КОНЧИЛИСЬ", W/2, H/2-40);
  cx.fillStyle="#fff"; cx.font="16px sans-serif";
  cx.fillText("Набито очков:", W/2, H/2-12);
  cx.fillStyle="#ff7043"; cx.font="bold 38px monospace";
  cx.fillText(score+"", W/2, H/2+24);
  cx.fillStyle="#90caf9"; cx.font="13px sans-serif";
  cx.fillText("Рекорд: "+best, W/2, H/2+48);
  drawBtn("🔁 ЕЩЁ РАЗ");
}

// ─── LOOP ───────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  cx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  if (gstate==="menu"){ fr++; drawMenu(); return; }

  update();
  drawBG();
  drawMan();
  for (const s of stuck) drawDartShape(s.x, s.y, s.ang, 0.85);
  if (dart) drawDartShape(dart.x, dart.y, dart.ang, 1);
  drawThrower();
  drawAim();
  drawHUD();
  if (gstate==="over") drawOver();
}

reset();
gstate = "menu";
loop();
})();
</script>
</body>
</html>
