<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Боба — Электрик</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { margin:0; overflow:hidden; background:#000; touch-action:none; user-select:none; }
canvas { position:fixed; top:0; left:0; display:block; }
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
(function () {
"use strict";

// ─── CANVAS ─────────────────────────────────────────────────
const cv = document.getElementById("g");
const cx = cv.getContext("2d");
const W = 480, H = 300;

function resize() {
  cv.width  = window.innerWidth;
  cv.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// перевод координат экрана → дизайн-координаты 480×300
function canvasXY(clientX, clientY) {
  return { x: clientX * W / cv.width, y: clientY * H / cv.height };
}

// ─── CONSTANTS ──────────────────────────────────────────────
const GR = 0.5, JUMP = -9, SPD = 3.2, PW = 20, PH = 42, GROUND = 258, WORLD = 4600;

// ─── LADDERS / LAMPS ────────────────────────────────────────
// у каждой стремянки своя лампа, пазл (кол-во проводов) и время на него (сек)
const LADDERS_INIT = [
  { x:360,  wires:3, time:13, done:false },
  { x:880,  wires:3, time:12, done:false },
  { x:1440, wires:4, time:12, done:false },
  { x:2040, wires:4, time:11, done:false },
  { x:2720, wires:5, time:11, done:false },
  { x:3420, wires:5, time:10, done:false },
  { x:4060, wires:5, time:9,  done:false },
];
let LADDERS = [];

const GOAL_X = 4480;

// ─── СЕРЁЖА — монтажник-отравитель ──────────────────────────
// толстенький в синей робе, патрулирует коридор; коснулся Бобы — травит стекломоем
const SERGEYS_INIT = [
  { x:1180, min:1060, max:1320, vx:1.7 },
  { x:1820, min:1700, max:1960, vx:-1.9 },
  { x:2440, min:2300, max:2560, vx:2.0 },
  { x:3120, min:2980, max:3260, vx:-1.8 },
  { x:3760, min:3620, max:3900, vx:2.1 },
];
let SERGEYS = [];

// цвета проводов
const WCOL = ["#e53935", "#1e88e5", "#43a047", "#fdd835", "#8e24aa"];
const WCOL_DK = ["#b71c1c", "#0d47a1", "#1b5e20", "#f9a825", "#4a148c"];

// ─── STATE ──────────────────────────────────────────────────
let player, cam, lives, score, fr, gstate, curLad, anim, puzzle, shock, hintAlpha;
let pz, poisoner, poisonSide, deathTitle, deathSub;

function initGame() {
  player = { x:60, y:GROUND-PH, vx:0, vy:0, onGround:true, facing:1, wf:0 };
  cam    = { x:0 };
  lives  = 3;
  score  = 0;
  fr     = 0;
  curLad = -1;
  anim   = 0;
  puzzle = null;
  shock  = 0;
  pz     = 0;
  poisoner = null;
  poisonSide = 1;
  deathTitle = "⚡ КОРОТКОЕ ЗАМЫКАНИЕ";
  deathSub   = "";
  hintAlpha = 3 * 60;
  LADDERS  = LADDERS_INIT.map(l => Object.assign({}, l, { done:false }));
  SERGEYS  = SERGEYS_INIT.map(s => Object.assign({}, s));
  gstate = "walk";
}

// ─── ГЕСТУРЫ (весь экран) ───────────────────────────────────
const activeTouches = new Map();
const gesture = { left:false, right:false };

function syncGesture() {
  gesture.left = gesture.right = false;
  for (const [, t] of activeTouches) {
    if (!t.isSwipe && !t.handled) {
      if (t.cx < W / 2) gesture.left = true;
      else              gesture.right = true;
    }
  }
}

function tryClimb() {
  if (gstate !== "walk") return false;
  for (let i = 0; i < LADDERS.length; i++) {
    const l = LADDERS[i];
    if (l.done) continue;
    if (Math.abs(player.x + PW/2 - l.x) < 34 && player.onGround) {
      startClimb(i);
      return true;
    }
  }
  return false;
}

function doJump() {
  if (gstate !== "walk" || !player.onGround) return;
  player.vy = JUMP;
  player.onGround = false;
}

// ↑ свайп / тап: у стремянки — лезем, иначе — прыгаем
function jumpOrClimb() {
  if (!tryClimb()) doJump();
}

document.addEventListener("touchstart", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = canvasXY(t.clientX, t.clientY);
    activeTouches.set(t.identifier, { sx:p.x, sy:p.y, cx:p.x, cy:p.y, t0:Date.now(), isSwipe:false, handled:false });
  }
  syncGesture();
}, { passive:false });

document.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = canvasXY(t.clientX, t.clientY);
    const at = activeTouches.get(t.identifier);
    if (!at) continue;
    at.cx = p.x; at.cy = p.y;
    if ((at.sy - at.cy) > 26) at.isSwipe = true;
  }
  syncGesture();
}, { passive:false });

document.addEventListener("touchend", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const at = activeTouches.get(t.identifier);
    if (!at) continue;
    const swipeUp  = (at.sy - at.cy) > 26 && Math.abs(at.cx - at.sx) < 90;
    const quickTap = Date.now() - at.t0 < 240 && Math.abs(at.cx - at.sx) < 18 && Math.abs(at.cy - at.sy) < 18;

    if (gstate === "walk") {
      if (swipeUp || quickTap) jumpOrClimb();
    } else if (gstate === "puzzle") {
      if (quickTap || (!at.isSwipe && Math.abs(at.cx-at.sx)<24 && Math.abs(at.cy-at.sy)<24))
        puzzleTap(at.cx, at.cy);
    } else if (gstate === "menu" || gstate === "dead" || gstate === "win") {
      handleMenuClick(at.cx, at.cy);
    }
    activeTouches.delete(t.identifier);
  }
  syncGesture();
}, { passive:false });

// мышь (десктоп)
cv.addEventListener("click", e => {
  const { x, y } = canvasXY(e.clientX, e.clientY);
  if (gstate === "puzzle") puzzleTap(x, y);
  else if (gstate === "menu" || gstate === "dead" || gstate === "win") handleMenuClick(x, y);
  else if (gstate === "walk") jumpOrClimb();
});

// клавиатура
const keys = {};
document.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (gstate === "walk" && (e.key === " " || e.key === "ArrowUp" || e.key === "w")) jumpOrClimb();
});
document.addEventListener("keyup", e => { keys[e.key] = false; });

// ─── ЛЕСТНИЦА / ПОДЪЁМ ──────────────────────────────────────
function startClimb(i) {
  curLad = i;
  gstate = "climb";
  anim = 0;
  player.vx = 0;
  player.x = LADDERS[i].x - PW/2;
}

function startPuzzle() {
  const l = LADDERS[curLad];
  const n = l.wires;
  // правый столбец — перемешанный порядок цветов
  const order = [];
  for (let i = 0; i < n; i++) order.push(i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  const secs = (l.time || 13) * 60;
  puzzle = {
    n, order,
    selLeft: -1,
    conn: new Array(n).fill(-1),   // conn[colorIdx] = правый ряд, к которому подключён
    time: secs,
    timeMax: secs,
    wrongFlash: 0, wrongL: -1, wrongR: -1
  };
  gstate = "puzzle";
}

// геометрия пазла (в координатах 480×300)
const PNL = { x:60, y:54, w:360, h:210 };
function rowY(i, n) {
  const top = PNL.y + 46, bot = PNL.y + PNL.h - 22;
  return top + (bot - top) * (n === 1 ? 0.5 : i / (n - 1));
}
const LEFT_TX = PNL.x + 56, RIGHT_TX = PNL.x + PNL.w - 56, TR = 15;

function puzzleTap(x, y) {
  if (!puzzle) return;
  const n = puzzle.n;
  // левый столбец
  for (let i = 0; i < n; i++) {
    if (puzzle.conn[i] >= 0) continue;
    if (Math.hypot(x - LEFT_TX, y - rowY(i, n)) < TR + 8) { puzzle.selLeft = i; return; }
  }
  // правый столбец
  for (let j = 0; j < n; j++) {
    const color = puzzle.order[j];
    if (puzzle.conn[color] >= 0) continue;            // уже занят
    if (Math.hypot(x - RIGHT_TX, y - rowY(j, n)) < TR + 8) {
      if (puzzle.selLeft < 0) return;
      if (puzzle.order[j] === puzzle.selLeft) {
        // верное соединение
        puzzle.conn[puzzle.selLeft] = j;
        score += 25;
        puzzle.selLeft = -1;
        if (puzzle.conn.every(c => c >= 0)) puzzleWin();
      } else {
        // ошибка — штраф по времени, вспышка
        puzzle.wrongFlash = 22; puzzle.wrongL = puzzle.selLeft; puzzle.wrongR = j;
        puzzle.time = Math.max(0, puzzle.time - 90);
        puzzle.selLeft = -1;
      }
      return;
    }
  }
}

function puzzleWin() {
  LADDERS[curLad].done = true;
  score += 200;
  gstate = "descend";
  anim = 0;
  puzzle = null;
}

function puzzleFail() {
  puzzle = null;
  shock = 0;
  gstate = "shock";
}

// ─── UPDATE ─────────────────────────────────────────────────
function update() {
  if (hintAlpha > 0) hintAlpha--;

  if (gstate === "walk")    updateWalk();
  else if (gstate === "climb")   updateClimb();
  else if (gstate === "descend") updateDescend();
  else if (gstate === "puzzle")  updatePuzzle();
  else if (gstate === "shock")   updateShock();
  else if (gstate === "poison")  updatePoison();
}

// фазы отравления (кадры при 60fps):
// 0-50 Серёжа протягивает бутылку → 50-95 Боба пьёт → 95-130 хватается за горло
// 130-165 блюёт → 165-280 падает, трясёт ногами, пена изо рта → 280+ финал
function updatePoison() {
  pz++;
  if (pz === 280) lives--;
  if (pz >= 360) {
    if (lives <= 0) { deathTitle = "☠️ ОТРАВЛЕНИЕ СТЕКЛОМОЕМ"; deathSub = "Серёжа всё-таки споил Бобу..."; gstate = "dead"; return; }
    // оживаем у предыдущей безопасной точки
    const safeX = (poisoner ? Math.max(0, (poisonSide > 0 ? poisoner.min : poisoner.max) - poisonSide*160) : player.x - 200);
    player.x = Math.max(0, safeX);
    player.y = GROUND - PH;
    poisoner = null;
    gstate = "walk";
  }
}

function updateWalk() {
  const goL = keys["ArrowLeft"]  || keys["a"] || gesture.left;
  const goR = keys["ArrowRight"] || keys["d"] || gesture.right;
  if (goL)      { player.vx = -SPD; player.facing = -1; }
  else if (goR) { player.vx =  SPD; player.facing =  1; }
  else          { player.vx *= 0.6; }

  if (player.onGround && Math.abs(player.vx) > 0.5) player.wf += 0.2;

  player.x += player.vx;
  if (player.x < 0) player.x = 0;
  if (player.x + PW > WORLD) player.x = WORLD - PW;

  // вертикаль (прыжок + гравитация)
  player.vy = Math.min(player.vy + GR, 14);
  player.y += player.vy;
  if (player.y >= GROUND - PH) { player.y = GROUND - PH; player.vy = 0; player.onGround = true; }
  else player.onGround = false;

  // Серёжи патрулируют. Травят стекломоем, только если Боба ПЕРЕД ними и НЕ в прыжке
  // (со спины можно проскочить, либо перепрыгнуть сверху)
  const lowEnough = (player.y + PH) > GROUND - 30;
  for (const s of SERGEYS) {
    s.x += s.vx;
    if (s.x < s.min || s.x > s.max) { s.vx *= -1; s.x = Math.max(s.min, Math.min(s.max, s.x)); }
    s.facing = s.vx > 0 ? 1 : -1;
    const d = (player.x + PW/2) - s.x;
    const inFront = (s.facing > 0) ? d > 0 : d < 0;
    if (Math.abs(d) < 17 && inFront && lowEnough) { startPoison(s); return; }
  }

  // финиш — только если все лампы заменены
  if (player.x + PW/2 > GOAL_X && LADDERS.every(l => l.done)) {
    gstate = "win"; score += 500;
  }

  cam.x += (player.x - 150 - cam.x) * 0.12;
  cam.x = Math.max(0, Math.min(cam.x, WORLD - W));
}

function startPoison(s) {
  poisoner = s;
  poisonSide = (s.x >= player.x + PW/2) ? 1 : -1;  // с какой стороны стоит Серёжа
  player.facing = poisonSide;                       // Боба повёрнут к нему
  pz = 0;
  gstate = "poison";
}

function updateClimb() {
  anim++;
  const l = LADDERS[curLad];
  const topY = GROUND - PH - 96;          // высота, на которой меняет лампу
  player.y = (GROUND - PH) + (topY - (GROUND - PH)) * Math.min(1, anim / 40);
  if (anim >= 40) startPuzzle();
}

function updateDescend() {
  anim++;
  const topY = GROUND - PH - 96;
  player.y = topY + ((GROUND - PH) - topY) * Math.min(1, anim / 30);
  if (anim >= 30) {
    player.y = GROUND - PH;
    // отойти от стремянки, чтобы не залезть снова сразу
    player.x = LADDERS[curLad].x + 40;
    curLad = -1;
    gstate = "walk";
  }
}

function updatePuzzle() {
  if (puzzle.wrongFlash > 0) puzzle.wrongFlash--;
  puzzle.time--;
  if (puzzle.time <= 0) puzzleFail();
}

function updateShock() {
  shock++;
  if (shock === 1) lives--;
  if (shock >= 110) {
    if (lives <= 0) { deathTitle = "⚡ КОРОТКОЕ ЗАМЫКАНИЕ"; deathSub = "Бобу выбило током..."; gstate = "dead"; return; }
    // слезает и можно повторить
    player.y = GROUND - PH;
    player.x = LADDERS[curLad].x + 40;
    curLad = -1;
    gstate = "walk";
  }
}

// ─── HELPERS ────────────────────────────────────────────────
function sx(wx) { return Math.round(wx - cam.x); }
function rr(x, y, w, h, r) {
  const m = Math.min(r, w/2, h/2);
  cx.beginPath();
  cx.moveTo(x+m, y); cx.lineTo(x+w-m, y); cx.arcTo(x+w,y, x+w,y+h, m);
  cx.lineTo(x+w,y+h-m); cx.arcTo(x+w,y+h, x,y+h, m);
  cx.lineTo(x+m,y+h); cx.arcTo(x,y+h, x,y, m);
  cx.lineTo(x,y+m); cx.arcTo(x,y, x+w,y, m);
  cx.closePath();
}

// ─── DRAW: МИР ──────────────────────────────────────────────
function drawBG() {
  // стена
  const grd = cx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"#37474f"); grd.addColorStop(1,"#263238");
  cx.fillStyle = grd; cx.fillRect(0,0,W,H);
  // плитка на стене
  const off = (cam.x*0.4)%56;
  cx.strokeStyle = "rgba(255,255,255,0.04)"; cx.lineWidth = 1;
  for (let i=-1;i<W/56+2;i++){ cx.beginPath(); cx.moveTo(i*56-off,0); cx.lineTo(i*56-off,GROUND); cx.stroke(); }
  for (let j=0;j<GROUND;j+=42){ cx.beginPath(); cx.moveTo(0,j); cx.lineTo(W,j); cx.stroke(); }
  // окна
  cx.fillStyle = "rgba(120,160,200,0.10)";
  const wo = (cam.x*0.25)%320;
  for (let i=-1;i<3;i++){ rr(i*320-wo+40,40,120,90,6); cx.fill(); }
  // пол
  cx.fillStyle = "#5d4037"; cx.fillRect(0,GROUND,W,H-GROUND);
  cx.fillStyle = "#4e342e"; cx.fillRect(0,GROUND,W,4);
  const fo = (cam.x*0.7)%48;
  cx.strokeStyle = "rgba(0,0,0,0.18)"; cx.lineWidth = 1;
  for (let i=-1;i<W/48+2;i++){ cx.beginPath(); cx.moveTo(i*48-fo,GROUND+4); cx.lineTo(i*48-fo,H); cx.stroke(); }
}

function drawLamp(wx, lit) {
  const lx = sx(wx);
  const cy = GROUND - PH - 96 - 26;     // лампа над головой
  // провод к потолку
  cx.strokeStyle = "#263238"; cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(lx, 0); cx.lineTo(lx, cy-12); cx.stroke();
  // патрон
  cx.fillStyle = "#9e9e9e"; cx.fillRect(lx-6, cy-14, 12, 10);
  // свет
  if (lit) {
    const g = cx.createRadialGradient(lx,cy,4,lx,cy,80);
    g.addColorStop(0,"rgba(255,245,160,0.55)"); g.addColorStop(1,"rgba(255,245,160,0)");
    cx.fillStyle = g; cx.beginPath(); cx.arc(lx,cy,80,0,Math.PI*2); cx.fill();
  }
  // колба
  cx.fillStyle = lit ? "#fff59d" : "#90a4ae";
  cx.beginPath(); cx.arc(lx, cy, 11, 0, Math.PI*2); cx.fill();
  cx.fillStyle = lit ? "#fff176" : "#78909c";
  cx.fillRect(lx-5, cy+8, 10, 5);
  if (lit) {
    cx.strokeStyle = "#f9a825"; cx.lineWidth = 1.2;
    cx.beginPath(); cx.moveTo(lx-3,cy+2); cx.lineTo(lx,cy-2); cx.lineTo(lx+3,cy+2); cx.stroke();
  }
}

function drawLadder(wx, done) {
  const lx = sx(wx);
  if (lx < -60 || lx > W+60) return;
  const topY = GROUND - 100, botY = GROUND;
  // A-образная стремянка
  cx.strokeStyle = "#e0843a"; cx.lineWidth = 5; cx.lineCap = "round";
  // передние стойки
  cx.beginPath(); cx.moveTo(lx-16, botY); cx.lineTo(lx-6, topY); cx.stroke();
  cx.beginPath(); cx.moveTo(lx+16, botY); cx.lineTo(lx+6, topY); cx.stroke();
  // задние стойки (светлее)
  cx.strokeStyle = "#b5651d"; cx.lineWidth = 4;
  cx.beginPath(); cx.moveTo(lx-6, botY); cx.lineTo(lx, topY-2); cx.stroke();
  cx.beginPath(); cx.moveTo(lx+24, botY); cx.lineTo(lx+8, topY-2); cx.stroke();
  // ступени
  cx.strokeStyle = "#c9742e"; cx.lineWidth = 4;
  for (let s = 0; s < 4; s++) {
    const yy = botY - 18 - s*22;
    const t = (yy - botY) / (topY - botY);
    const lxx = lx - 16 + (10)*t, rxx = lx + 16 - (10)*t;
    cx.beginPath(); cx.moveTo(lxx, yy); cx.lineTo(rxx, yy); cx.stroke();
  }
  // верхняя площадка
  cx.fillStyle = "#a85a1a"; cx.fillRect(lx-10, topY-4, 20, 5);

  // маркер «залезть»
  if (!done) {
    const near = Math.abs(player.x + PW/2 - wx) < 34;
    if (near && gstate === "walk") {
      const bob = Math.sin(fr*0.15)*3;
      cx.fillStyle = "#ffeb3b";
      cx.font = "bold 12px sans-serif"; cx.textAlign = "center";
      cx.fillText("↑ залезть", lx, topY - 30 + bob);
    }
  } else {
    // галочка готово
    cx.fillStyle = "#69f0ae"; cx.font = "bold 14px sans-serif"; cx.textAlign = "center";
    cx.fillText("✓", lx, topY - 14);
  }
}

// ─── DRAW: БОБА ─────────────────────────────────────────────
// цифровой камуфляж (серо-зелёный пиксельный)
const CAMO = ["#b9bdab", "#9aa089", "#d7dacb", "#7e856b"];
function camoRect(x, y, w, h) {
  cx.fillStyle = CAMO[0]; cx.fillRect(x, y, w, h);
  const spots = [
    [0.08,0.10,0.30,0.18,1],[0.55,0.04,0.28,0.20,3],
    [0.22,0.42,0.26,0.20,2],[0.60,0.46,0.30,0.22,1],
    [0.05,0.70,0.26,0.20,3],[0.56,0.74,0.30,0.18,2]
  ];
  for (const [fx,fy,fw,fh,ci] of spots) {
    cx.fillStyle = CAMO[ci];
    cx.fillRect(x+fx*w, y+fy*h, Math.max(2,fw*w), Math.max(2,fh*h));
  }
}

function drawBoba(px, py, opts) {
  opts = opts || {};
  const f = player.facing;
  const armUp = opts.armUp;       // тянется к лампе
  const dangle = opts.dangle;     // болтается (удар током)
  const jumping = (gstate === "walk" && !player.onGround);
  const wf = (gstate === "walk" && player.onGround) ? player.wf : 0;
  const ls = Math.sin(wf)*9, as = Math.sin(wf)*7;

  cx.save();
  cx.translate(px, py);
  if (dangle) cx.rotate(Math.sin(fr*0.6)*0.18);
  if (f < 0) cx.scale(-1,1);

  // тень (только на земле)
  if (gstate === "walk" && player.onGround) {
    cx.fillStyle = "rgba(0,0,0,0.14)";
    cx.beginPath(); cx.ellipse(0, PH+2, 14, 5, 0, 0, Math.PI*2); cx.fill();
  }

  // ноги — камуфляжные штаны, бежевые наколенники и ботинки
  cx.lineCap = "butt";
  for (const [ox, sgn] of [[-5,1],[5,-1]]) {
    cx.save(); cx.translate(ox,30);
    if (jumping) cx.rotate(sgn*16*Math.PI/180);          // ноги поджаты в прыжке
    else if (!dangle) cx.rotate(ls*sgn*Math.PI/180);
    else cx.rotate(Math.sin(fr*0.5+sgn)*0.3);
    camoRect(-4,0,7,13);                                  // штанина (камуфляж)
    cx.fillStyle = "#c2a878"; rr(-4,3,7,5,2); cx.fill();  // бежевый наколенник
    cx.strokeStyle = "#9c8456"; cx.lineWidth = 0.8; rr(-4,3,7,5,2); cx.stroke();
    cx.fillStyle = "#a98c5c"; cx.fillRect(-5,11,9,6);     // песочный ботинок
    cx.fillStyle = "#8a6f43"; cx.fillRect(-5,15,9,2);
    cx.restore();
  }

  // тело — камуфляжная куртка (ACU)
  camoRect(-9,14,18,18);
  // воротник / молния
  cx.fillStyle = "#8a9078"; cx.fillRect(-9,14,18,3);
  cx.strokeStyle = "#6f7560"; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(0,15); cx.lineTo(0,31); cx.stroke();
  // нагрудный карман с клапаном
  cx.fillStyle = "#9aa089"; cx.fillRect(-7,22,6,6);
  cx.strokeStyle = "#7e856b"; cx.lineWidth = 0.8; cx.strokeRect(-7,22,6,6);
  // нашивка-флажок на плече
  cx.fillStyle = "#b71c1c"; cx.fillRect(3,16,5,2);

  // руки — камуфляжные рукава, СИНИЕ перчатки
  cx.lineCap = "round";
  // задняя рука
  cx.save(); cx.translate(-9,18);
  if (jumping) cx.rotate(-0.9);              // вскинута в прыжке
  else cx.rotate((-as-12)*Math.PI/180);
  cx.strokeStyle = CAMO[1]; cx.lineWidth = 5;
  cx.beginPath(); cx.moveTo(0,0); cx.lineTo(0,12); cx.stroke();
  cx.fillStyle = "#1e88e5"; cx.beginPath(); cx.arc(0,13,3.4,0,Math.PI*2); cx.fill();
  cx.strokeStyle = "#0d47a1"; cx.lineWidth = 1; cx.beginPath(); cx.arc(0,13,3.4,0,Math.PI*2); cx.stroke();
  cx.restore();
  // передняя рука (поднята к лампе при замене)
  cx.save(); cx.translate(9,18);
  if (armUp) cx.rotate(-2.4 + Math.sin(fr*0.3)*0.12);
  else if (dangle) cx.rotate(-2.6);          // держится за лампу
  else if (jumping) cx.rotate(0.9);          // вскинута в прыжке
  else cx.rotate((as+12)*Math.PI/180);
  cx.strokeStyle = CAMO[0]; cx.lineWidth = 5;
  cx.beginPath(); cx.moveTo(0,0); cx.lineTo(0,12); cx.stroke();
  cx.fillStyle = "#1e88e5"; cx.beginPath(); cx.arc(0,13,3.4,0,Math.PI*2); cx.fill();
  cx.strokeStyle = "#0d47a1"; cx.lineWidth = 1; cx.beginPath(); cx.arc(0,13,3.4,0,Math.PI*2); cx.stroke();
  cx.restore();

  // голова: короткая стрижка «ёжиком» + лицо (без каски)
  cx.fillStyle = "#4a3526"; cx.beginPath(); cx.arc(0,7,9,0,Math.PI*2); cx.fill();      // волосы
  cx.fillStyle = "#f5cba7"; cx.beginPath(); cx.arc(0,9,8.2,0,Math.PI*2); cx.fill();    // лицо
  // ухо
  cx.fillStyle = "#f0bd95"; cx.beginPath(); cx.arc(-7,9,2,0,Math.PI*2); cx.fill();
  // глаза
  cx.fillStyle = "#2c1a0e";
  if (dangle) {
    cx.font = "bold 7px sans-serif"; cx.fillText("X", 1.5,10); cx.fillText("X", -4.5,10);
  } else {
    cx.beginPath(); cx.arc(3,8,1.6,0,Math.PI*2); cx.arc(-3,8,1.6,0,Math.PI*2); cx.fill();
  }
  // брови
  cx.strokeStyle = "#4a3526"; cx.lineWidth = 1.2;
  cx.beginPath(); cx.moveTo(-5,5.5); cx.lineTo(-1,6); cx.moveTo(1,6); cx.lineTo(5,5.5); cx.stroke();
  // рот
  cx.strokeStyle = "#2c1a0e"; cx.lineWidth = 1.5;
  if (dangle) { cx.beginPath(); cx.arc(0,14,2.2,Math.PI,Math.PI*2); cx.stroke(); }
  else if (jumping) { cx.beginPath(); cx.arc(0,12,2.2,0,Math.PI*2); cx.stroke(); }  // «оп!»
  else if (armUp) { cx.beginPath(); cx.arc(0,12,2,0,Math.PI*2); cx.stroke(); }
  else { cx.beginPath(); cx.arc(0,11,2.5,0.1,Math.PI-0.1); cx.stroke(); }

  cx.restore();
}

// ─── DRAW: УДАР ТОКОМ ───────────────────────────────────────
function drawShock(px, py) {
  // молнии вокруг
  cx.strokeStyle = (fr%4<2) ? "#fff176" : "#4fc3f7";
  cx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const a = (i/6)*Math.PI*2 + fr*0.4;
    const r1 = 16, r2 = 28 + Math.sin(fr*0.5+i)*6;
    cx.beginPath();
    cx.moveTo(px+Math.cos(a)*r1, py+PH/2+Math.sin(a)*r1);
    const ma = a+0.2;
    cx.lineTo(px+Math.cos(ma)*r1*1.5, py+PH/2+Math.sin(ma)*r1*1.5);
    cx.lineTo(px+Math.cos(a)*r2, py+PH/2+Math.sin(a)*r2);
    cx.stroke();
  }
  if (fr%6<3) {
    cx.fillStyle = "rgba(255,255,180,0.18)";
    cx.fillRect(0,0,W,H);
  }
}

// ─── DRAW: БУТЫЛКА СТЕКЛОМОЯ ────────────────────────────────
function drawBottle() {
  cx.fillStyle = "#1565c0"; rr(-3.5,-2,8,13,2); cx.fill();      // синяя жидкость
  cx.fillStyle = "#42a5f5"; rr(-3.5,-2,8,4,2); cx.fill();
  cx.fillStyle = "#cfd8dc"; cx.fillRect(-2,-6,5,4);             // горлышко
  cx.fillStyle = "#b0bec5"; cx.fillRect(-2.5,-8.5,6,2.8);       // распылитель
  cx.fillStyle = "#eceff1"; rr(-3.5,2,8,6,1); cx.fill();        // этикетка
  cx.strokeStyle = "#90a4ae"; cx.lineWidth = 0.5; rr(-3.5,2,8,6,1); cx.stroke();
  cx.fillStyle = "#0d47a1"; cx.font = "bold 3px sans-serif"; cx.textAlign = "center";
  cx.fillText("СТЕКЛО", 0.5, 5); cx.fillText("МОЙ", 0.5, 8);
}

// жёлтая подтяжка-линейка от (x1,y1) до (x2,y2) с делениями
function rulerStrap(x1, y1, x2, y2) {
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy), ang = Math.atan2(dy,dx);
  cx.save(); cx.translate(x1,y1); cx.rotate(ang);
  cx.fillStyle = "#fdd835"; cx.fillRect(0,-2.3,len,4.6);          // жёлтая лента
  cx.strokeStyle = "#f9a825"; cx.lineWidth = 0.6; cx.strokeRect(0,-2.3,len,4.6);
  cx.strokeStyle = "#222"; cx.lineWidth = 0.8;                    // деления как на линейке
  for (let t = 2; t < len; t += 2.6) {
    const big = (Math.round(t/2.6) % 2 === 0);
    cx.beginPath(); cx.moveTo(t,-2.3); cx.lineTo(t, big ? 0.8 : -0.6); cx.stroke();
  }
  cx.restore();
}

// пакет OZON, из которого Серёжа достаёт стекломой
function drawOzonBag(x, y) {
  cx.save(); cx.translate(x,y);
  // ручки
  cx.strokeStyle = "#0a3fd0"; cx.lineWidth = 1.4;
  cx.beginPath(); cx.arc(-3.5,-10,3,Math.PI,0); cx.stroke();
  cx.beginPath(); cx.arc(3.5,-10,3,Math.PI,0); cx.stroke();
  // тело пакета
  cx.fillStyle = "#005bff"; rr(-9,-10,18,20,2); cx.fill();
  cx.fillStyle = "#0a4fe0"; cx.fillRect(-9,-10,18,3);
  // надпись ozon + фирменный «хвостик»
  cx.fillStyle = "#fff"; cx.font = "bold 6px Arial"; cx.textAlign = "center";
  cx.fillText("ozon", 0, 2);
  cx.fillStyle = "#f1117e"; cx.beginPath(); cx.arc(8,1.5,1.4,0,Math.PI*2); cx.fill();
}

// ─── DRAW: СЕРЁЖА ───────────────────────────────────────────
function drawSergey(px, feetY, facing, opts) {
  opts = opts || {};
  cx.save(); cx.translate(px, feetY);
  if (facing < 0) cx.scale(-1, 1);

  // тень
  cx.fillStyle = "rgba(0,0,0,0.14)";
  cx.beginPath(); cx.ellipse(0,-1,18,5,0,0,Math.PI*2); cx.fill();

  // ноги (короткие, толстые)
  const lk = opts.walk ? Math.sin(fr*0.3)*8 : 0;
  for (const [ox,sgn] of [[-6,1],[6,-1]]) {
    cx.save(); cx.translate(ox,-17); cx.rotate(lk*sgn*Math.PI/180);
    cx.fillStyle = "#0d47a1"; cx.fillRect(-4,0,9,17);
    cx.fillStyle = "#222"; cx.fillRect(-5,15,11,5);
    cx.restore();
  }

  // задняя рука
  cx.save(); cx.translate(-14,-42); cx.rotate(opts.backArm!=null?opts.backArm:0.35);
  cx.strokeStyle = "#1565c0"; cx.lineWidth = 6; cx.lineCap = "round";
  cx.beginPath(); cx.moveTo(0,0); cx.lineTo(0,16); cx.stroke();
  cx.fillStyle = "#f0c098"; cx.beginPath(); cx.arc(0,16,3.6,0,Math.PI*2); cx.fill();
  cx.restore();

  // пузо — синий комбинезон
  cx.fillStyle = "#1565c0"; cx.beginPath(); cx.ellipse(0,-30,17,19,0,0,Math.PI*2); cx.fill();
  cx.fillStyle = "#1e88e5"; cx.beginPath(); cx.ellipse(2,-27,12,13,0,0,Math.PI*2); cx.fill();
  // жёлтые подтяжки в виде линейки (рулетка-сантиметр)
  rulerStrap(-8,-47, -7,-22);
  rulerStrap(8,-47, 7,-22);
  // застёжки-карабины внизу
  cx.fillStyle = "#9e9e9e"; cx.fillRect(-9,-25,4,3); cx.fillRect(5,-25,4,3);

  // голова
  cx.fillStyle = "#f0c098"; cx.beginPath(); cx.arc(0,-52,9.5,0,Math.PI*2); cx.fill();
  cx.fillStyle = "#e8b487"; cx.beginPath(); cx.ellipse(0,-44,7,3.5,0,0,Math.PI*2); cx.fill(); // второй подбородок
  // венчик волос вокруг лысины
  cx.fillStyle = "#6d4c2f";
  cx.beginPath(); cx.arc(-8,-52,2.6,0,Math.PI*2); cx.arc(8,-52,2.6,0,Math.PI*2); cx.fill();
  cx.fillRect(-9,-54,18,2);
  // лысина-блик
  cx.fillStyle = "#f7ceaa"; cx.beginPath(); cx.ellipse(0,-57,5,3,0,0,Math.PI*2); cx.fill();
  // хитрые брови домиком
  cx.strokeStyle = "#5a3d24"; cx.lineWidth = 1.3;
  cx.beginPath(); cx.moveTo(-6,-56); cx.lineTo(-1,-54.5); cx.moveTo(1,-54.5); cx.lineTo(6,-56); cx.stroke();
  // глаза-хитринки
  cx.fillStyle = "#2c1a0e";
  cx.beginPath(); cx.arc(3,-52.5,1.5,0,Math.PI*2); cx.arc(-3,-52.5,1.5,0,Math.PI*2); cx.fill();
  // ухмылка
  cx.strokeStyle = "#7a3b1a"; cx.lineWidth = 1.7;
  if (opts.smile === "big") { cx.beginPath(); cx.arc(0,-47,4.5,0.05,Math.PI-0.05); cx.stroke(); }
  else { cx.beginPath(); cx.arc(1.5,-47,3.5,0.25,Math.PI-0.6); cx.stroke(); }
  // щетина
  cx.fillStyle = "rgba(70,50,35,0.22)";
  cx.beginPath(); cx.arc(0,-45,7,0.15,Math.PI-0.15); cx.fill();

  // передняя рука (может протягивать бутылку)
  const fa = (opts.frontArm!=null) ? opts.frontArm : (-0.3 - (opts.walk?Math.sin(fr*0.3)*0.4:0));
  cx.save(); cx.translate(14,-42); cx.rotate(fa);
  cx.strokeStyle = "#1565c0"; cx.lineWidth = 6; cx.lineCap = "round";
  cx.beginPath(); cx.moveTo(0,0); cx.lineTo(0,17); cx.stroke();
  cx.fillStyle = "#f0c098"; cx.beginPath(); cx.arc(0,17,3.6,0,Math.PI*2); cx.fill();
  if (opts.bottle) { cx.save(); cx.translate(0,19); cx.rotate(-fa); drawBottle(); cx.restore(); }
  cx.restore();

  cx.restore();
}

// ─── DRAW: БОБА ОТРАВЛЕН (стоя, фазы A–D) ───────────────────
function drawBobaPoison(bx, by) {
  if (pz >= 165) { drawBobaCollapsed(bx); return; }
  const f = poisonSide;
  const lean = (pz>=130) ? 0.5 : 0;     // наклон вперёд при рвоте

  cx.save(); cx.translate(bx, by);
  if (f < 0) cx.scale(-1,1);
  if (lean) { cx.translate(0,30); cx.rotate(lean); cx.translate(0,-30); }

  cx.fillStyle="rgba(0,0,0,0.14)";
  cx.beginPath(); cx.ellipse(0,PH+2,14,5,0,0,Math.PI*2); cx.fill();

  // ноги (дрожь после фазы C)
  cx.lineCap="butt";
  for (const [ox,sgn] of [[-5,1],[5,-1]]) {
    cx.save(); cx.translate(ox,30);
    if (pz>=95) cx.rotate(Math.sin(fr*0.9+sgn*2)*0.06);
    camoRect(-4,0,7,13);
    cx.fillStyle="#c2a878"; rr(-4,3,7,5,2); cx.fill();
    cx.fillStyle="#a98c5c"; cx.fillRect(-5,11,9,6);
    cx.restore();
  }
  // тело
  camoRect(-9,14,18,18);
  cx.fillStyle="#8a9078"; cx.fillRect(-9,14,18,3);
  cx.fillStyle="#b71c1c"; cx.fillRect(3,16,5,2);

  // руки
  cx.lineCap="round";
  function arm(axp,ayp,ang,col){
    cx.save(); cx.translate(axp,ayp); cx.rotate(ang);
    cx.strokeStyle=col; cx.lineWidth=5; cx.beginPath(); cx.moveTo(0,0); cx.lineTo(0,13); cx.stroke();
    cx.fillStyle="#1e88e5"; cx.beginPath(); cx.arc(0,13,3.4,0,Math.PI*2); cx.fill();
    cx.strokeStyle="#0d47a1"; cx.lineWidth=1; cx.beginPath(); cx.arc(0,13,3.4,0,Math.PI*2); cx.stroke();
    cx.restore();
  }
  if (pz < 50)       { arm(-9,18, 0.25, CAMO[1]); arm(9,18, -1.0, CAMO[0]); }   // тянется к бутылке
  else if (pz < 95)  { arm(-9,18, 0.25, CAMO[1]); arm(9,18, -2.5, CAMO[0]); }   // пьёт
  else if (pz < 130) { arm(-9,18, -2.2, CAMO[1]); arm(9,18, -2.6, CAMO[0]); }   // за горло
  else               { arm(-9,18, -0.5, CAMO[1]); arm(9,18,  0.7, CAMO[0]); }   // блюёт

  // голова
  const sick = pz>=95;
  cx.fillStyle="#4a3526"; cx.beginPath(); cx.arc(0,7,9,0,Math.PI*2); cx.fill();
  cx.fillStyle= sick ? "#a9c98f" : "#f5cba7"; cx.beginPath(); cx.arc(0,9,8.2,0,Math.PI*2); cx.fill();
  cx.fillStyle="#2c1a0e";
  if (pz>=95) {  // зажмурился от боли (крестики)
    cx.strokeStyle="#2c1a0e"; cx.lineWidth=1.4;
    cx.beginPath();
    cx.moveTo(-5,6); cx.lineTo(-1,9); cx.moveTo(-1,6); cx.lineTo(-5,9);
    cx.moveTo(1,6); cx.lineTo(5,9); cx.moveTo(5,6); cx.lineTo(1,9); cx.stroke();
  } else {
    cx.beginPath(); cx.arc(3,8,1.8,0,Math.PI*2); cx.arc(-3,8,1.8,0,Math.PI*2); cx.fill();
  }
  // рот
  if (pz<50) { cx.strokeStyle="#2c1a0e"; cx.lineWidth=1.5; cx.beginPath(); cx.arc(0,12,2,0,Math.PI*2); cx.stroke(); }
  else if (pz<95) { cx.fillStyle="#5d3a1a"; cx.beginPath(); cx.ellipse(2,11,2.5,3,0,0,Math.PI*2); cx.fill(); }
  else { cx.fillStyle="#5d3a1a"; cx.beginPath(); cx.arc(0,13,3,0,Math.PI*2); cx.fill(); }

  cx.restore();

  // бутылка у рта во время питья
  if (pz>=50 && pz<95) {
    cx.save(); cx.translate(bx + f*5, by+6); cx.rotate(f*-0.9); drawBottle(); cx.restore();
  }
  // струя рвоты
  if (pz>=130 && pz<165) {
    const vx0 = bx + f*9, vy0 = by+16;
    cx.fillStyle="#7cb342";
    for (let i=0;i<6;i++){
      const t=i/6, vxp=vx0+f*(6+t*24+Math.sin(fr*0.5+i)*2), vyp=vy0+t*16;
      cx.beginPath(); cx.arc(vxp,vyp,3+t*2,0,Math.PI*2); cx.fill();
    }
    cx.fillStyle="#9ccc65"; cx.beginPath(); cx.ellipse(vx0+f*32, GROUND-2, 14,4,0,0,Math.PI*2); cx.fill();
  }
}

// ─── DRAW: БОБА УПАЛ (фазы E–F: трясёт ногами, пена) ────────
function drawBobaCollapsed(bx) {
  const f = poisonSide;
  cx.save(); cx.translate(bx, GROUND-5);
  if (f < 0) cx.scale(-1,1);

  // лужа рвоты
  cx.fillStyle="#9ccc65"; cx.beginPath(); cx.ellipse(-2,2,24,5,0,0,Math.PI*2); cx.fill();

  // ноги дёргаются вверх
  const k1=Math.sin(fr*0.7)*11, k2=Math.sin(fr*0.7+1.3)*11;
  cx.lineCap="round";
  cx.strokeStyle=CAMO[1]; cx.lineWidth=7;
  cx.save(); cx.translate(15,-3); cx.rotate((-65+k1)*Math.PI/180); cx.beginPath(); cx.moveTo(0,0); cx.lineTo(0,15); cx.stroke();
  cx.fillStyle="#a98c5c"; cx.fillRect(-4,13,9,5); cx.restore();
  cx.strokeStyle=CAMO[0]; cx.lineWidth=7;
  cx.save(); cx.translate(11,-3); cx.rotate((-80+k2)*Math.PI/180); cx.beginPath(); cx.moveTo(0,0); cx.lineTo(0,15); cx.stroke();
  cx.fillStyle="#a98c5c"; cx.fillRect(-4,13,9,5); cx.restore();

  // тело лёжа
  camoRect(-16,-13,28,12);
  cx.fillStyle="#b71c1c"; cx.fillRect(-6,-13,5,2);
  // раскинутая рука
  cx.strokeStyle=CAMO[0]; cx.lineWidth=5;
  cx.beginPath(); cx.moveTo(-10,-7); cx.lineTo(-20,-2); cx.stroke();
  cx.fillStyle="#1e88e5"; cx.beginPath(); cx.arc(-20,-2,3.2,0,Math.PI*2); cx.fill();

  // голова (лицо вверх)
  cx.fillStyle="#4a3526"; cx.beginPath(); cx.arc(-22,-8,9,0,Math.PI*2); cx.fill();
  cx.fillStyle="#a9c98f"; cx.beginPath(); cx.arc(-22,-6,8,0,Math.PI*2); cx.fill();
  // крестики-глаза
  cx.strokeStyle="#2c1a0e"; cx.lineWidth=1.4;
  cx.beginPath();
  cx.moveTo(-26,-9); cx.lineTo(-23,-6); cx.moveTo(-23,-9); cx.lineTo(-26,-6);
  cx.moveTo(-20,-9); cx.lineTo(-17,-6); cx.moveTo(-17,-9); cx.lineTo(-20,-6); cx.stroke();
  // открытый рот
  cx.fillStyle="#5d3a1a"; cx.beginPath(); cx.arc(-22,-1,2.4,0,Math.PI*2); cx.fill();
  // пена изо рта
  cx.fillStyle="rgba(255,255,255,0.92)";
  for (let i=0;i<8;i++){
    const a=fr*0.06+i*1.1;
    const fxp=-24-(i%3)*3+Math.sin(a)*1.4, fyp=1+(i*1.5)+Math.cos(a)*1.4;
    cx.beginPath(); cx.arc(fxp,fyp,1.5+(i%2)*0.9,0,Math.PI*2); cx.fill();
  }
  cx.restore();
}

// ─── DRAW: СЦЕНА ОТРАВЛЕНИЯ ─────────────────────────────────
function drawPoison() {
  const bx = sx(player.x)+PW/2, by = player.y;
  const leave = Math.max(0, pz-285);
  const sgx = bx + poisonSide*(30 + leave*1.8);
  const sgFacing = leave>0 ? poisonSide : -poisonSide;

  // пакет OZON на полу рядом с Серёжей, пока он не споил Бобу
  if (pz < 95 && leave === 0) {
    const bagX = sgx + poisonSide*15;
    drawOzonBag(bagX, GROUND-2);
    // бутылка «вырастает» из пакета на первой фазе
    if (pz < 22) {
      const rise = (pz/22)*16;
      cx.save(); cx.translate(bagX, GROUND-12 - rise); drawBottle(); cx.restore();
    }
  }

  let sgOpts;
  if (pz < 22)     sgOpts = { frontArm:-0.55, smile:"" };               // лезет в пакет
  else if (pz < 50)sgOpts = { frontArm:-1.05, bottle:true, smile:"" };  // достал, протягивает
  else if (pz<95)  sgOpts = { frontArm:-0.3, smile:"big" };
  else if (pz<280) sgOpts = { frontArm:-0.25, smile:"big" };
  else             sgOpts = { walk:true, smile:"big" };

  drawSergey(sgx, GROUND, sgFacing, sgOpts);
  drawBobaPoison(bx, by);

  // реплика-баннер
  let say;
  if (pz<22)       say = "Серёжа достаёт стекломой из пакета OZON 📦";
  else if (pz<50)  say = "Серёжа: — Будешь стекломой? 🍾";
  else if (pz<95)  say = "Боба пьёт залпом...";
  else if (pz<130) say = "Боба хватается за горло!";
  else if (pz<165) say = "Бу-э-э... 🤮";
  else if (pz<280) say = "Пена изо рта, ноги трясутся... 💀";
  else             say = "Серёжа довольно уходит. Ха-ха-ха!";
  cx.fillStyle="rgba(0,0,0,0.6)"; cx.fillRect(0,30,W,22);
  cx.fillStyle="#fff"; cx.font="bold 12px sans-serif"; cx.textAlign="center";
  cx.fillText(say, W/2, 45);
}

// ─── DRAW: ПАЗЛ ─────────────────────────────────────────────
function drawPuzzle() {
  // затемнение
  cx.fillStyle = "rgba(0,0,0,0.78)"; cx.fillRect(0,0,W,H);
  // панель
  cx.fillStyle = "#eceff1"; rr(PNL.x,PNL.y,PNL.w,PNL.h,12); cx.fill();
  cx.strokeStyle = "#90a4ae"; cx.lineWidth = 3; rr(PNL.x,PNL.y,PNL.w,PNL.h,12); cx.stroke();
  // винтики по углам
  cx.fillStyle = "#b0bec5";
  for (const [ox,oy] of [[10,10],[PNL.w-10,10],[10,PNL.h-10],[PNL.w-10,PNL.h-10]]) {
    cx.beginPath(); cx.arc(PNL.x+ox,PNL.y+oy,3,0,Math.PI*2); cx.fill();
  }

  // заголовок
  cx.fillStyle = "#37474f"; cx.font = "bold 13px sans-serif"; cx.textAlign = "center";
  cx.fillText("СОЕДИНИ ПРОВОДА ПО ЦВЕТУ", W/2, PNL.y+24);

  const n = puzzle.n;

  // таймер
  const tp = puzzle.time / puzzle.timeMax;
  cx.fillStyle = "rgba(0,0,0,0.12)"; rr(PNL.x+30,PNL.y+30,PNL.w-60,7,3); cx.fill();
  cx.fillStyle = tp>0.4 ? "#43a047" : (tp>0.18?"#fb8c00":"#e53935");
  rr(PNL.x+30,PNL.y+30,(PNL.w-60)*tp,7,3); cx.fill();

  // существующие соединения
  for (let i = 0; i < n; i++) {
    if (puzzle.conn[i] < 0) continue;
    const y1 = rowY(i, n), y2 = rowY(puzzle.conn[i], n);
    cx.strokeStyle = WCOL[i]; cx.lineWidth = 5; cx.lineCap = "round";
    cx.beginPath();
    cx.moveTo(LEFT_TX, y1);
    cx.bezierCurveTo((LEFT_TX+RIGHT_TX)/2, y1, (LEFT_TX+RIGHT_TX)/2, y2, RIGHT_TX, y2);
    cx.stroke();
  }

  // линия от выбранного левого к пальцу (визуальная подсказка)
  if (puzzle.selLeft >= 0) {
    const y1 = rowY(puzzle.selLeft, n);
    cx.fillStyle = WCOL[puzzle.selLeft];
    cx.font = "11px sans-serif"; cx.textAlign = "left";
    cx.fillText("→ выбери пару справа", PNL.x+30, PNL.y+PNL.h-8);
  }

  // вспышка ошибки
  if (puzzle.wrongFlash > 0 && fr%4<2) {
    const y1 = rowY(puzzle.wrongL, n), y2 = rowY(puzzle.wrongR, n);
    cx.strokeStyle = "#ff1744"; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(LEFT_TX,y1); cx.lineTo(RIGHT_TX,y2); cx.stroke();
  }

  // левые клеммы (фиксированный порядок цветов)
  for (let i = 0; i < n; i++) {
    const y = rowY(i, n), done = puzzle.conn[i] >= 0, sel = puzzle.selLeft === i;
    drawTerminal(LEFT_TX, y, WCOL[i], WCOL_DK[i], done, sel, true);
  }
  // правые клеммы (перемешанный порядок)
  for (let j = 0; j < n; j++) {
    const color = puzzle.order[j], y = rowY(j, n), done = puzzle.conn[color] >= 0;
    drawTerminal(RIGHT_TX, y, WCOL[color], WCOL_DK[color], done, false, false);
  }
}

function drawTerminal(x, y, col, dk, done, sel, isLeft) {
  // хвостик провода к краю панели
  cx.strokeStyle = dk; cx.lineWidth = 5; cx.lineCap = "round";
  cx.beginPath(); cx.moveTo(x, y);
  cx.lineTo(isLeft ? PNL.x+8 : PNL.x+PNL.w-8, y); cx.stroke();
  // клемма
  if (sel) {
    cx.strokeStyle = "#fff"; cx.lineWidth = 3;
    cx.beginPath(); cx.arc(x,y,TR+5,0,Math.PI*2); cx.stroke();
  }
  cx.fillStyle = col; cx.beginPath(); cx.arc(x,y,TR,0,Math.PI*2); cx.fill();
  cx.strokeStyle = dk; cx.lineWidth = 2.5; cx.beginPath(); cx.arc(x,y,TR,0,Math.PI*2); cx.stroke();
  // блик
  cx.fillStyle = "rgba(255,255,255,0.45)";
  cx.beginPath(); cx.arc(x-4,y-4,4,0,Math.PI*2); cx.fill();
  if (done) {
    cx.fillStyle = "#fff"; cx.font = "bold 13px sans-serif"; cx.textAlign = "center";
    cx.fillText("✓", x, y+4);
  }
}

// ─── HUD ────────────────────────────────────────────────────
function drawHUD() {
  cx.fillStyle = "rgba(0,0,0,0.5)"; cx.fillRect(0,0,W,24);
  cx.fillStyle = "#ffeb3b"; cx.font = "bold 12px monospace"; cx.textAlign = "left";
  cx.fillText("💰 "+score, 8, 16);
  cx.textAlign = "right";
  cx.fillText("❤️".repeat(Math.max(0,lives)), W-8, 16);
  // счётчик ламп
  const done = LADDERS.filter(l=>l.done).length;
  cx.fillStyle = "#fff"; cx.textAlign = "center"; cx.font = "bold 12px monospace";
  cx.fillText("💡 "+done+"/"+LADDERS.length, W/2, 16);

  if (hintAlpha > 0 && gstate === "walk") {
    const a = Math.min(1, hintAlpha/60);
    cx.save(); cx.globalAlpha = a;
    cx.fillStyle = "rgba(0,0,0,0.55)"; cx.fillRect(0,H-22,W,22);
    cx.fillStyle = "#fff"; cx.font = "10px sans-serif"; cx.textAlign = "center";
    cx.fillText("◀ ходьба ▶   |   ↑ свайп/тап = прыжок   |   у стремянки — залезть", W/2, H-7);
    cx.restore();
  }

  // зоны управления
  if (gstate === "walk") {
    cx.save(); cx.globalAlpha = 0.05;
    cx.fillStyle = gesture.left ? "#fff":"#aaa"; cx.fillRect(0,24,W/2,H-24);
    cx.fillStyle = gesture.right? "#fff":"#aaa"; cx.fillRect(W/2,24,W/2,H-24);
    cx.restore();
  }
}

// ─── МЕНЮ / ОВЕРЛЕИ ─────────────────────────────────────────
function drawOverlay(title, sub, btn, col) {
  cx.fillStyle = "rgba(0,0,0,0.74)"; cx.fillRect(0,0,W,H);
  cx.fillStyle = "#fff"; cx.font = "bold 26px sans-serif"; cx.textAlign = "center";
  cx.fillText(title, W/2, H/2-40);
  cx.font = "14px sans-serif"; cx.fillStyle = "#ddd";
  cx.fillText(sub, W/2, H/2-8);
  cx.fillStyle = col; rr(W/2-88, H/2+14, 176, 46, 23); cx.fill();
  cx.fillStyle = "#fff"; cx.font = "bold 17px sans-serif";
  cx.fillText(btn, W/2, H/2+43);
}

function drawMenu() {
  const grd = cx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"#1a237e"); grd.addColorStop(1,"#0d47a1");
  cx.fillStyle = grd; cx.fillRect(0,0,W,H);
  // искры на фоне
  for (let i=0;i<40;i++){
    cx.fillStyle = `rgba(255,235,120,${0.2+Math.sin(fr*0.05+i)*0.15})`;
    cx.fillRect((i*127)%W,(i*83)%H,2,2);
  }
  cx.fillStyle = "#fdd835"; cx.font = "bold 30px monospace"; cx.textAlign = "center";
  cx.fillText("БОБА", W/2, 70);
  cx.fillStyle = "#fff"; cx.font = "bold 16px monospace";
  cx.fillText("ЭЛЕКТРИК", W/2, 94);
  cx.fillStyle = "#b3e5fc"; cx.font = "11px sans-serif";
  cx.fillText("7 стремянок: меняй лампы, соединяя провода по цвету.", W/2, 118);
  cx.fillText("Не зевай у патч-панели — иначе ударит током!", W/2, 132);
  cx.fillStyle = "#ffab91";
  cx.fillText("⚠ Серёжа споит стекломоем — перепрыгни его или обойди сзади!", W/2, 148);

  // превью Бобы (камуфляж + синие перчатки + ёжик)
  cx.save(); cx.translate(W/2, 196); cx.scale(1.4,1.4);
  camoRect(-5,12,6,13); camoRect(1,12,6,13);                       // штанины
  cx.fillStyle = "#c2a878"; rr(-5,15,6,5,2); cx.fill(); rr(1,15,6,5,2); cx.fill();  // наколенники
  cx.fillStyle = "#a98c5c"; cx.fillRect(-6,23,8,5); cx.fillRect(1,23,8,5);          // ботинки
  camoRect(-9,-2,18,16);                                           // куртка
  cx.fillStyle = "#b71c1c"; cx.fillRect(3,0,5,2);                  // нашивка
  cx.strokeStyle = CAMO[0]; cx.lineWidth = 5; cx.lineCap = "round";
  cx.beginPath(); cx.moveTo(-9,2); cx.lineTo(-13,13); cx.stroke();
  cx.beginPath(); cx.moveTo(9,2); cx.lineTo(13,13); cx.stroke();
  cx.fillStyle = "#1e88e5"; cx.beginPath(); cx.arc(-13,13,3.4,0,Math.PI*2); cx.arc(13,13,3.4,0,Math.PI*2); cx.fill();
  cx.fillStyle = "#4a3526"; cx.beginPath(); cx.arc(0,-11,9,0,Math.PI*2); cx.fill();   // волосы
  cx.fillStyle = "#f5cba7"; cx.beginPath(); cx.arc(0,-9,8.2,0,Math.PI*2); cx.fill();  // лицо
  cx.fillStyle = "#2c1a0e"; cx.beginPath(); cx.arc(3,-10,1.5,0,Math.PI*2); cx.arc(-3,-10,1.5,0,Math.PI*2); cx.fill();
  cx.strokeStyle = "#4a3526"; cx.lineWidth = 1.2;
  cx.beginPath(); cx.moveTo(-5,-12.5); cx.lineTo(-1,-12); cx.moveTo(1,-12); cx.lineTo(5,-12.5); cx.stroke();
  cx.strokeStyle = "#2c1a0e"; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(0,-6,2.2,0.1,Math.PI-0.1); cx.stroke();
  cx.restore();

  cx.fillStyle = "#43a047"; rr(W/2-96,224,192,46,23); cx.fill();
  cx.fillStyle = "#fff"; cx.font = "bold 20px sans-serif"; cx.textAlign = "center";
  cx.fillText("▶  ИГРАТЬ", W/2, 253);
  cx.fillStyle = "rgba(255,255,255,0.35)"; cx.font = "10px sans-serif";
  cx.fillText("Жесты: ◀ левая  |  ↑ свайп/тап = прыжок  |  правая ▶", W/2, 288);
}

function handleMenuClick(x, y) {
  if (gstate === "menu") {
    if (x>W/2-96 && x<W/2+96 && y>224 && y<270) initGame();
  } else if (gstate === "dead" || gstate === "win") {
    if (x>W/2-88 && x<W/2+88 && y>H/2+14 && y<H/2+60) { initGame(); gstate = "walk"; }
  }
}

// ─── DRAW ВСЕГО ─────────────────────────────────────────────
function drawWorld() {
  drawBG();
  // лампы + стремянки
  for (const l of LADDERS) { drawLamp(l.x, l.done); drawLadder(l.x, l.done); }
  // финиш-табличка
  const gx = sx(GOAL_X);
  if (gx > -40 && gx < W+40) {
    const allDone = LADDERS.every(l=>l.done);
    cx.fillStyle = allDone ? "#43a047" : "#616161";
    rr(gx-26,GROUND-70,52,30,5); cx.fill();
    cx.fillStyle = "#fff"; cx.font = "bold 9px sans-serif"; cx.textAlign = "center";
    cx.fillText("ВЫХОД", gx, GROUND-50);
    cx.fillStyle = allDone ? "#c8e6c9" : "#9e9e9e"; cx.font = "8px sans-serif";
    cx.fillText(allDone?"открыто":"замени лампы", gx, GROUND-40);
  }

  // Серёжи (патрулируют) — кроме сцены отравления, где врага рисует drawPoison
  if (gstate !== "poison") {
    for (const s of SERGEYS) {
      const sgx = sx(s.x);
      if (sgx < -40 || sgx > W+40) continue;
      drawSergey(sgx, GROUND, s.facing || 1, { walk:true });
    }
  }

  // Боба / сцена
  const px = sx(player.x) + PW/2, py = player.y;
  if (gstate === "poison") {
    drawPoison();
  } else if (gstate === "climb" || gstate === "puzzle" || gstate === "descend") {
    drawBoba(px, py, { armUp:true });
  } else if (gstate === "shock") {
    drawBoba(px, py, { dangle:true });
    drawShock(px, py);
  } else {
    drawBoba(px, py, {});
  }
}

// ─── LOOP ───────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  fr++;
  cx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);

  if (gstate === "menu") { drawMenu(); return; }

  update();
  drawWorld();
  drawHUD();

  if (gstate === "puzzle") drawPuzzle();
  if (gstate === "dead") drawOverlay(deathTitle, (deathSub?deathSub+" ":"")+"Ламп: "+LADDERS.filter(l=>l.done).length+"/"+LADDERS.length, "🔁 ЗАНОВО", "#c62828");
  if (gstate === "win")  drawOverlay("💡 ВСЕ ЛАМПЫ ГОРЯТ!", "Отличная работа, Боба! Счёт: "+score, "▶ ЕЩЁ РАЗ", "#2e7d32");
}

initGame();
gstate = "menu";
loop();
})();
</script>
