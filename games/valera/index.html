<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Валера — Слаботочник</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #000;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; overflow: hidden;
  touch-action: none; user-select: none;
}
canvas { display: block; }
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
(function () {
"use strict";

// ─── CANVAS ─────────────────────────────────────────────────
const cv = document.getElementById("g");
const cx = cv.getContext("2d");
const W = 480, H = 300;
cv.width = W; cv.height = H;

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width  = (W * s) + "px";
  cv.style.height = (H * s) + "px";
}
window.addEventListener("resize", resize);
resize();

function canvasXY(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  return { x: (clientX - r.left) * (W / r.width), y: (clientY - r.top) * (H / r.height) };
}

// ─── CONSTANTS ──────────────────────────────────────────────
const GR = 0.46, JUMP = -9.8, SPD = 3.4, PW = 20, PH = 42, WORLD = 5200;

// ─── LEVEL ──────────────────────────────────────────────────
const PLATS = [
  { x:0,    y:258, w:700,  h:42, c:"#455a64" },
  { x:160,  y:210, w:110,  h:16, c:"#607d8b" },
  { x:830,  y:258, w:230,  h:42, c:"#455a64" },
  { x:870,  y:208, w:90,   h:16, c:"#607d8b" },
  { x:1110, y:258, w:380,  h:42, c:"#455a64" },
  { x:1150, y:228, w:70,   h:16, c:"#607d8b" },
  { x:1240, y:190, w:70,   h:16, c:"#607d8b" },
  { x:1330, y:152, w:80,   h:16, c:"#607d8b" },
  { x:1420, y:190, w:70,   h:16, c:"#607d8b" },
  { x:1590, y:258, w:960,  h:42, c:"#455a64" },
  { x:1640, y:208, w:140,  h:16, c:"#6d4c41" },
  { x:1870, y:208, w:140,  h:16, c:"#6d4c41" },
  { x:2100, y:208, w:140,  h:16, c:"#6d4c41" },
  { x:2360, y:208, w:80,   h:16, c:"#607d8b" },
  { x:2660, y:258, w:150,  h:42, c:"#455a64" },
  { x:2690, y:198, w:80,   h:16, c:"#607d8b" },
  { x:2880, y:258, w:150,  h:42, c:"#455a64" },
  { x:2910, y:198, w:80,   h:16, c:"#607d8b" },
  { x:3100, y:258, w:150,  h:42, c:"#455a64" },
  { x:3130, y:158, w:80,   h:16, c:"#607d8b" },
  { x:3320, y:258, w:150,  h:42, c:"#455a64" },
  { x:3350, y:198, w:80,   h:16, c:"#607d8b" },
  { x:3570, y:258, w:1200, h:42, c:"#37474f" },
  { x:3610, y:200, w:80,   h:16, c:"#546e7a" },
  { x:3760, y:162, w:80,   h:16, c:"#546e7a" },
  { x:3910, y:124, w:100,  h:16, c:"#546e7a" },
  { x:4070, y:162, w:80,   h:16, c:"#546e7a" },
  { x:4220, y:200, w:80,   h:16, c:"#546e7a" },
  { x:4460, y:258, w:800,  h:42, c:"#1b5e20" },
  { x:4510, y:180, w:80,   h:16, c:"#2e7d32" },
];

const TIES = [
  { x:220,  y:196, done:false },
  { x:920,  y:194, done:false },
  { x:1370, y:138, done:false },
  { x:1710, y:194, done:false },
  { x:1940, y:194, done:false },
  { x:2170, y:194, done:false },
  { x:2740, y:184, done:false },
  { x:3950, y:110, done:false },
];

const CHAIRS = [
  { x:300,  y:247, vx: 1.2, min:20,   max:680,  w:32, h:28 },
  { x:1750, y:247, vx:-1.2, min:1600, max:2540, w:32, h:28 },
  { x:3620, y:247, vx: 1.0, min:3575, max:4440, w:32, h:28 },
];

// Техназзор: инспектор в очках с документами
function makeInspector(x, facing) {
  return { x, y:258, facing, sightRange:280,
    alerted:false, alertTimer:0, throwTimer:0, throwCooldown:80,
    papers:[], dead:false };
}
const INSPECTORS_INIT = [
  makeInspector(560,  -1),
  makeInspector(2100,  1),
  makeInspector(4150, -1),
];
let INSPECTORS = [];

const CPS = [
  { x:1590, y:212, w:16, h:46, done:false },
  { x:2660, y:212, w:16, h:46, done:false },
  { x:3570, y:212, w:16, h:46, done:false },
];

const GOAL = { x:4620, y:170, w:55, h:88 };

// ─── STATE ──────────────────────────────────────────────────
let player, cam, lives, score, fr, trail, gstate, jumpsLeft, djFx, hintAlpha;

function initGame() {
  player = { x:80, y:210, vx:0, vy:0, onGround:false, facing:1, wf:0, cpX:80, cpY:210 };
  cam   = { x:0 };
  lives = 3;
  score = 0;
  fr    = 0;
  trail = [];
  djFx  = 0;
  hintAlpha = 2.5; // seconds * 60
  jumpsLeft = 2;
  TIES.forEach(t => t.done = false);
  CPS.forEach(c => c.done = false);
  CHAIRS.forEach((ch, i) => ch.x = [300, 1750, 3620][i]);
  INSPECTORS = INSPECTORS_INIT.map(t => Object.assign({}, t, { papers:[], alerted:false, alertTimer:0, throwTimer:0, dead:false }));
  gstate = "play";
}

// ─── GESTURE CONTROLS (весь экран) ──────────────────────────
// Левая половина = идти влево, правая = вправо
// Свайп вверх (dy > 28px) = прыжок / двойной прыжок
const activeTouches = new Map();
const gesture = { left:false, right:false };

function doJump() {
  if (gstate !== "play") return;
  if (jumpsLeft <= 0) return;
  if (jumpsLeft === 1) djFx = 14; // двойной прыжок — искры
  player.vy = jumpsLeft === 1 ? JUMP * 0.85 : JUMP;
  jumpsLeft--;
  player.onGround = false;
}

function syncGesture() {
  gesture.left = gesture.right = false;
  for (const [, t] of activeTouches) {
    if (!t.isSwipe) {
      if (t.cx < W / 2) gesture.left  = true;
      else               gesture.right = true;
    }
  }
}

document.addEventListener("touchstart", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = canvasXY(t.clientX, t.clientY);
    activeTouches.set(t.identifier, { sx:p.x, sy:p.y, cx:p.x, cy:p.y, t0:Date.now(), isSwipe:false });
  }
  syncGesture();
}, { passive:false });

document.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = canvasXY(t.clientX, t.clientY);
    const at = activeTouches.get(t.identifier);
    if (!at) continue;
    at.cx = p.x; at.cy = p.y;
    if ((at.sy - at.cy) > 26) at.isSwipe = true; // начало свайпа вверх
  }
  syncGesture();
}, { passive:false });

document.addEventListener("touchend", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const at = activeTouches.get(t.identifier);
    if (!at) continue;
    const swipeUp  = (at.sy - at.cy) > 26 && Math.abs(at.cx - at.sx) < 80;
    const quickTap = Date.now() - at.t0 < 220 && Math.abs(at.cx - at.sx) < 18 && Math.abs(at.cy - at.sy) < 18;
    if (swipeUp || quickTap) doJump();
    // обработка меню / оверлея при тапе
    if (gstate === "menu" || gstate === "dead" || gstate === "win") {
      handleMenuClick(at.cx, at.cy);
    }
    activeTouches.delete(t.identifier);
  }
  syncGesture();
}, { passive:false });

// клавиатура
const keys = {};
document.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (gstate === "play" && (e.key === " " || e.key === "ArrowUp" || e.key === "w" || e.key === "ц")) doJump();
});
document.addEventListener("keyup", e => { keys[e.key] = false; });

// ─── PHYSICS ────────────────────────────────────────────────
function rectHit(ax,ay,aw,ah, bx,by,bw,bh) {
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

function update() {
  if (gstate !== "play") return;
  fr++;
  if (djFx > 0) djFx--;
  if (hintAlpha > 0) hintAlpha--;

  const goL = keys["ArrowLeft"]  || keys["a"] || keys["A"] || keys["ф"] || gesture.left;
  const goR = keys["ArrowRight"] || keys["d"] || keys["D"] || keys["в"] || gesture.right;

  if (goL)      { player.vx = -SPD; player.facing = -1; }
  else if (goR) { player.vx =  SPD; player.facing =  1; }
  else          { player.vx *= 0.65; }

  if (Math.abs(player.vx) > 0.6) player.wf += 0.18;

  // X + collide
  player.x += player.vx;
  if (player.x < 0) player.x = 0;
  if (player.x + PW > WORLD) player.x = WORLD - PW;
  for (const p of PLATS) {
    if (rectHit(player.x, player.y, PW, PH, p.x, p.y, p.w, p.h)) {
      if (player.vx > 0) { player.x = p.x - PW; player.vx = 0; }
      else                { player.x = p.x + p.w; player.vx = 0; }
    }
  }

  // Y + collide
  player.vy = Math.min(player.vy + GR, 13);
  player.y  += player.vy;
  player.onGround = false;
  for (const p of PLATS) {
    if (rectHit(player.x, player.y, PW, PH, p.x, p.y, p.w, p.h)) {
      if (player.vy >= 0) {
        player.y = p.y - PH;
        player.vy = 0;
        player.onGround = true;
        jumpsLeft = 2; // приземление — восстанавливаем оба прыжка
      } else {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  if (player.y > H + 60) { die(); return; }

  // Кресла
  for (const ch of CHAIRS) {
    ch.x += ch.vx;
    if (ch.x < ch.min || ch.x + ch.w > ch.max) ch.vx *= -1;
    if (rectHit(player.x, player.y, PW, PH, ch.x, ch.y - ch.h, ch.w, ch.h)) {
      if (player.vy > 0 && player.y + PH < ch.y - ch.h + 12) {
        player.vy = JUMP * 0.55; ch.vx *= -1; score += 50;
      } else { die(); return; }
    }
  }

  // Техназзор
  if (updateInspectors()) return;

  // Стяжки
  for (const t of TIES) {
    if (!t.done && Math.abs(player.x+PW/2-t.x)<14 && Math.abs(player.y+PH/2-t.y)<14) {
      t.done = true; score += 100;
    }
  }

  // Чекпоинты
  for (const cp of CPS) {
    if (!cp.done && rectHit(player.x, player.y, PW, PH, cp.x, cp.y, cp.w, cp.h)) {
      cp.done = true; player.cpX = cp.x; player.cpY = cp.y - PH;
    }
  }

  if (rectHit(player.x, player.y, PW, PH, GOAL.x, GOAL.y, GOAL.w, GOAL.h)) {
    gstate = "win"; score += 1000;
  }

  cam.x += (player.x - 150 - cam.x) * 0.1;
  cam.x = Math.max(0, Math.min(cam.x, WORLD - W));

  if (fr % 2 === 0) {
    trail.push({ x: player.x + PW/2, y: player.y + PH - 6 });
    if (trail.length > 500) trail.shift();
  }
}

function die() {
  lives--;
  if (lives <= 0) { gstate = "dead"; return; }
  player.x = player.cpX; player.y = player.cpY;
  player.vx = player.vy = 0;
  jumpsLeft = 2;
  trail = [];
}

// ─── ТЕХНАЗЗОР ──────────────────────────────────────────────
function updateInspectors() {
  for (const insp of INSPECTORS) {
    // Бумаги обновляем всегда (даже после смерти надзора)
    for (let i = insp.papers.length - 1; i >= 0; i--) {
      const p = insp.papers[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.1;
      p.angle += p.spin; p.life--;
      if (p.life <= 0) { insp.papers.splice(i, 1); continue; }
      // столкновение с платформой
      let hit = false;
      for (const pl of PLATS) {
        if (rectHit(p.x-6, p.y-4, 12, 8, pl.x, pl.y, pl.w, pl.h)) { hit = true; break; }
      }
      if (hit) { insp.papers.splice(i, 1); continue; }
      // попал в игрока
      if (rectHit(p.x-7, p.y-5, 14, 10, player.x, player.y, PW, PH)) {
        insp.papers.splice(i, 1);
        die(); return true;
      }
    }

    if (insp.dead) continue;

    // Зона видимости: горизонт ± 90px по Y, sightRange по X в направлении взгляда
    const dx = player.x + PW/2 - insp.x;
    const dy = Math.abs(player.y + PH/2 - insp.y);
    const inFront = (insp.facing > 0) ? dx > 0 : dx < 0;
    const inSight = dy < 90 && Math.abs(dx) < insp.sightRange && inFront;

    if (inSight && !insp.alerted) {
      insp.alerted = true; insp.alertTimer = 0; insp.throwTimer = 0;
    }
    if (insp.alerted) {
      insp.facing = dx > 0 ? 1 : -1; // поворачивается к игроку
      insp.alertTimer++;
      if (insp.alertTimer > 55) { // после фазы "!" начинает бросать
        insp.throwTimer++;
        if (insp.throwTimer >= insp.throwCooldown) {
          insp.throwTimer = 0;
          throwPaper(insp);
        }
      }
    }

    // Топнуть по надзору
    const ih = 44;
    if (rectHit(player.x, player.y, PW, PH, insp.x - 14, insp.y - ih, 28, ih)) {
      if (player.vy > 0 && player.y + PH < insp.y - ih + 14) {
        insp.dead = true; player.vy = JUMP * 0.5; score += 300;
      } else {
        die(); return true;
      }
    }
  }
  return false;
}

function throwPaper(insp) {
  const spd = 3.8;
  const ox = insp.facing > 0 ? 18 : -18;
  const ix = insp.x + ox, iy = insp.y - 32;
  const tx = player.x + PW/2, ty = player.y + PH/2;
  const ddx = tx - ix, ddy = ty - iy;
  const d = Math.sqrt(ddx*ddx + ddy*ddy) || 1;
  insp.papers.push({
    x:ix, y:iy,
    vx:(ddx/d)*spd, vy:(ddy/d)*spd - 1.2,
    angle: Math.atan2(ddy, ddx),
    spin: (Math.random() - 0.5) * 0.22,
    life: 200
  });
}

// ─── HELPERS ────────────────────────────────────────────────
function sx(wx) { return Math.round(wx - cam.x); }
function rr(x, y, w, h, r) {
  const m = Math.min(r, w/2, h/2);
  cx.beginPath();
  cx.moveTo(x+m, y); cx.lineTo(x+w-m, y); cx.arcTo(x+w,y, x+w,y+h, m);
  cx.lineTo(x+w,y+h-m); cx.arcTo(x+w,y+h, x,y+h, m);
  cx.lineTo(x+m,y+h); cx.arcTo(x,y+h, x,y, m);
  cx.lineTo(x,y+m); cx.arcTo(x,y, x+w,y, m);
  cx.closePath();
}

// ─── DRAWING ────────────────────────────────────────────────
function drawBG() {
  cx.fillStyle = "#d7ccc8"; cx.fillRect(0,0,W,H);
  const off = (cam.x * 0.25) % 80;
  cx.fillStyle = "#cfd8dc";
  for (let i = -1; i < W/80+1; i++) cx.fillRect(i*80-off, 0, 38, H);
  cx.fillStyle = "#bdbdbd";
  const co = (cam.x * 0.1) % 40;
  for (let i = -1; i < W/40+1; i++) cx.fillRect(i*40-co, 2, 36, 12);
  cx.fillStyle = "rgba(0,0,0,0.12)"; cx.fillRect(0,256,W,6);
  cx.strokeStyle = "rgba(180,140,60,0.22)"; cx.lineWidth = 3;
  cx.setLineDash([12,8]);
  const cw = (cam.x * 0.15) % W;
  for (let i = -1; i < 4; i++) {
    cx.beginPath(); cx.moveTo(i*160-cw,50); cx.lineTo(i*160-cw+60,50); cx.lineTo(i*160-cw+60,H); cx.stroke();
  }
  cx.setLineDash([]);
}

function drawPlatforms() {
  for (const p of PLATS) {
    const px = sx(p.x);
    if (px+p.w<0||px>W) continue;
    cx.fillStyle = p.c; cx.fillRect(px,p.y,p.w,p.h);
    cx.fillStyle = "rgba(255,255,255,0.18)"; cx.fillRect(px,p.y,p.w,3);
    cx.fillStyle = "rgba(0,0,0,0.2)"; cx.fillRect(px,p.y+p.h-4,p.w,4);
  }
}

function drawGoal() {
  const gx = sx(GOAL.x);
  if (gx>W||gx+GOAL.w<0) return;
  cx.fillStyle = "#0d47a1"; cx.fillRect(gx,GOAL.y,GOAL.w,GOAL.h);
  cx.strokeStyle = "#1565c0"; cx.lineWidth = 2; cx.strokeRect(gx,GOAL.y,GOAL.w,GOAL.h);
  for (let row=0;row<4;row++) for (let col=0;col<3;col++) {
    cx.fillStyle = row===0&&col===0 ? "#ffeb3b" : "#e0e0e0";
    cx.fillRect(gx+5+col*16, GOAL.y+7+row*19, 12, 10);
  }
  if (Math.floor(fr/18)%2===0) {
    cx.fillStyle = "#69f0ae"; cx.beginPath(); cx.arc(gx+57,GOAL.y+6,4,0,Math.PI*2); cx.fill();
  }
  cx.fillStyle = "#ffeb3b"; cx.font = "bold 9px monospace"; cx.textAlign = "center";
  cx.fillText("ПАТЧ-ПАНЕЛЬ", gx+GOAL.w/2, GOAL.y+GOAL.h+14);
  cx.fillText("← ПОДКЛЮЧИ",  gx+GOAL.w/2, GOAL.y+GOAL.h+25);
}

function drawCable() {
  if (trail.length < 3) return;
  cx.save(); cx.lineCap = "round"; cx.lineJoin = "round";
  cx.strokeStyle = "rgba(0,0,0,0.2)"; cx.lineWidth = 5;
  cx.beginPath(); cx.moveTo(sx(trail[0].x), trail[0].y+2);
  for (let i=1;i<trail.length;i++) cx.lineTo(sx(trail[i].x), trail[i].y+2);
  cx.stroke();
  cx.strokeStyle = "#fdd835"; cx.lineWidth = 4;
  cx.beginPath(); cx.moveTo(sx(trail[0].x), trail[0].y);
  for (let i=1;i<trail.length;i++) cx.lineTo(sx(trail[i].x), trail[i].y);
  cx.stroke();
  cx.strokeStyle = "rgba(255,255,255,0.45)"; cx.lineWidth = 1.2; cx.setLineDash([5,7]);
  cx.beginPath(); cx.moveTo(sx(trail[0].x), trail[0].y-1);
  for (let i=1;i<trail.length;i++) cx.lineTo(sx(trail[i].x), trail[i].y-1);
  cx.stroke(); cx.setLineDash([]); cx.restore();
}

function drawTies() {
  for (const t of TIES) {
    if (t.done) continue;
    const tx_ = sx(t.x);
    if (tx_<-20||tx_>W+20) continue;
    const bob = Math.sin(fr*0.08)*2.5;
    cx.save(); cx.translate(tx_, t.y+bob);
    cx.fillStyle = "rgba(41,182,246,0.22)"; cx.beginPath(); cx.arc(0,0,15,0,Math.PI*2); cx.fill();
    cx.fillStyle = "#0288d1"; rr(-9,-5,18,10,5); cx.fill();
    cx.fillStyle = "#01579b"; cx.fillRect(5,-7,5,14);
    cx.fillStyle = "#e3f2fd"; cx.font = "bold 7px sans-serif"; cx.textAlign = "center";
    cx.fillText("+100", 0, -10-bob);
    cx.restore();
  }
}

function drawChairs() {
  for (const ch of CHAIRS) {
    const chx = sx(ch.x);
    if (chx+ch.w<0||chx>W) continue;
    cx.save(); cx.translate(chx+ch.w/2, ch.y);
    if (ch.vx>0) cx.scale(-1,1);
    cx.fillStyle = "#212121";
    for (const wx of [-12,0,12]) { cx.beginPath(); cx.arc(wx,2,4,0,Math.PI*2); cx.fill(); }
    cx.strokeStyle = "#616161"; cx.lineWidth = 3; cx.lineCap = "round";
    const rot = fr*0.06*Math.sign(ch.vx);
    for (let i=0;i<5;i++) {
      const a = (i/5)*Math.PI*2+rot;
      cx.beginPath(); cx.moveTo(0,-4); cx.lineTo(Math.cos(a)*13,-4+Math.sin(a)*6); cx.stroke();
    }
    cx.fillStyle = "#1a237e"; cx.fillRect(-14,-22,28,8);
    cx.fillStyle = "#283593"; cx.fillRect(-3,-30,12,18);
    cx.fillStyle = "#ef5350"; cx.fillRect(-6,-27,5,3); cx.fillRect(2,-27,5,3);
    cx.restore();
  }
}

function drawCheckpoints() {
  for (const cp of CPS) {
    const cpx = sx(cp.x);
    if (cpx+cp.w<0||cpx>W) continue;
    cx.fillStyle = cp.done ? "#43a047" : "#f9a825"; cx.fillRect(cpx,cp.y,cp.w,cp.h);
    cx.fillStyle = cp.done ? "#1b5e20" : "#e65100";
    cx.beginPath(); cx.moveTo(cpx+cp.w,cp.y); cx.lineTo(cpx+cp.w+18,cp.y+12); cx.lineTo(cpx+cp.w,cp.y+24); cx.fill();
  }
}

// ─── ТЕХНАЗЗОР (рисование) ──────────────────────────────────
function drawInspectors() {
  for (const insp of INSPECTORS) {
    // Летящие бумаги
    for (const p of insp.papers) {
      const px_ = sx(p.x);
      if (px_<-20||px_>W+20) continue;
      cx.save(); cx.translate(px_, p.y); cx.rotate(p.angle);
      cx.fillStyle = "#fff9c4"; cx.fillRect(-7,-5,14,10);
      cx.strokeStyle = "#ccc"; cx.lineWidth = 0.5; cx.strokeRect(-7,-5,14,10);
      cx.strokeStyle = "#aaa";
      cx.beginPath(); cx.moveTo(-4,-2); cx.lineTo(4,-2);
      cx.moveTo(-4,0);  cx.lineTo(4,0);
      cx.moveTo(-4,2);  cx.lineTo(4,2);
      cx.stroke();
      cx.restore();
    }

    if (insp.dead) continue;
    const ix_ = sx(insp.x);
    if (ix_<-60||ix_>W+60) continue;

    cx.save();
    cx.translate(ix_, insp.y);
    if (insp.facing < 0) cx.scale(-1, 1);

    // Тень
    cx.fillStyle = "rgba(0,0,0,0.12)";
    cx.beginPath(); cx.ellipse(0, 2, 16, 5, 0, 0, Math.PI*2); cx.fill();

    // НОГИ — тёмные брюки
    cx.fillStyle = "#263238";
    cx.fillRect(-7,-14,6,16); cx.fillRect(2,-14,6,16);
    cx.fillStyle = "#111";
    cx.fillRect(-9,0,8,5); cx.fillRect(2,0,9,5);

    // ТУЛОВИЩЕ — пиджак
    cx.fillStyle = "#37474f"; cx.fillRect(-10,-38,20,26);
    // Белая рубашка
    cx.fillStyle = "#fafafa"; cx.fillRect(-3,-38,6,12);
    // Красный галстук
    cx.fillStyle = "#c62828"; cx.fillRect(-1,-36,3,20);
    // Лацканы пиджака
    cx.fillStyle = "#2e3d44";
    cx.beginPath(); cx.moveTo(-3,-38); cx.lineTo(-10,-28); cx.lineTo(-5,-28); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(3,-38);  cx.lineTo(10,-28);  cx.lineTo(5,-28);  cx.closePath(); cx.fill();

    // Левая рука (сзади, спокойная)
    cx.strokeStyle = "#37474f"; cx.lineWidth = 6; cx.lineCap = "round";
    cx.save(); cx.translate(-10,-32); cx.rotate(0.2);
    cx.beginPath(); cx.moveTo(0,0); cx.lineTo(0,15); cx.stroke();
    cx.fillStyle = "#f5cba7"; cx.beginPath(); cx.arc(0,15,3,0,Math.PI*2); cx.fill();
    cx.restore();

    // Правая рука — поднята с документом (машет при броске)
    const throwAng = insp.alerted && insp.alertTimer > 55
      ? -0.8 + Math.sin(insp.throwTimer * 0.14) * 0.45
      : 0.2;
    cx.save(); cx.translate(10,-32); cx.rotate(throwAng);
    cx.strokeStyle = "#37474f"; cx.lineWidth = 6; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(0,0); cx.lineTo(0,15); cx.stroke();
    cx.fillStyle = "#f5cba7"; cx.beginPath(); cx.arc(0,15,3,0,Math.PI*2); cx.fill();
    // Стопка документов в руке
    cx.save(); cx.translate(0,15); cx.rotate(-throwAng*0.5);
    cx.fillStyle = "#fffde7"; cx.fillRect(-7,-1,15,11);
    cx.fillStyle = "#fff9c4"; cx.fillRect(-5,1,15,11);
    cx.strokeStyle = "#ccc"; cx.lineWidth = 0.8; cx.strokeRect(-7,-1,15,11); cx.strokeRect(-5,1,15,11);
    cx.strokeStyle = "#bbb";
    cx.beginPath(); cx.moveTo(-3,4); cx.lineTo(5,4); cx.moveTo(-3,7); cx.lineTo(5,7); cx.stroke();
    cx.restore(); cx.restore();

    // ГОЛОВА
    cx.fillStyle = "#f5cba7";
    cx.beginPath(); cx.arc(0,-46,9,0,Math.PI*2); cx.fill();
    // Редкие волосы
    cx.fillStyle = "#4e342e";
    cx.fillRect(-8,-55,16,6); cx.fillRect(-5,-54,10,3);
    // ОЧКИ
    cx.strokeStyle = "#1a1a1a"; cx.lineWidth = 1.5;
    cx.strokeRect(-8,-50,7,5); cx.strokeRect(1,-50,7,5);
    cx.beginPath(); cx.moveTo(-1,-47); cx.lineTo(1,-47); cx.stroke(); // переносица
    cx.beginPath(); cx.moveTo(-8,-47); cx.lineTo(-11,-46); cx.stroke(); // дужки
    cx.beginPath(); cx.moveTo(8,-47); cx.lineTo(11,-46); cx.stroke();
    // Глаза за очками
    cx.fillStyle = "#1a237e";
    cx.beginPath(); cx.arc(-4,-47,1.2,0,Math.PI*2); cx.arc(4,-47,1.2,0,Math.PI*2); cx.fill();
    // Усы
    cx.fillStyle = "#4e342e";
    cx.beginPath(); cx.ellipse(-3,-41,3.5,1.8,0.15,0,Math.PI*2); cx.fill();
    cx.beginPath(); cx.ellipse(3,-41,3.5,1.8,-0.15,0,Math.PI*2); cx.fill();

    // ВОСКЛИЦАНИЕ ! при обнаружении
    if (insp.alerted && insp.alertTimer < 50 && Math.floor(insp.alertTimer/7)%2===0) {
      cx.fillStyle = "#ffeb3b";
      rr(-13,-78,26,24,5); cx.fill();
      cx.strokeStyle = "#f57f17"; cx.lineWidth = 1.5;
      rr(-13,-78,26,24,5); cx.stroke();
      // хвостик пузыря
      cx.fillStyle = "#ffeb3b";
      cx.beginPath(); cx.moveTo(-3,-54); cx.lineTo(3,-54); cx.lineTo(0,-47); cx.closePath(); cx.fill();
      cx.fillStyle = "#c62828"; cx.font = "bold 18px monospace"; cx.textAlign = "center";
      cx.fillText("!", 0, -60);
    }

    cx.restore();
  }
}

// ─── ВАЛЕРА ─────────────────────────────────────────────────
function drawValera() {
  const vx_ = sx(player.x) + PW/2;
  const vy_ = player.y;
  const f   = player.facing;
  const wf  = player.onGround ? player.wf : 0;
  const ls  = Math.sin(wf) * 9;
  const as  = Math.sin(wf) * 7;

  // Двойной прыжок — искры
  if (djFx > 0) {
    for (let i = 0; i < 8; i++) {
      const a = (i/8)*Math.PI*2 + fr*0.3;
      const r = (14 - djFx) * 1.2;
      cx.fillStyle = `rgba(100,200,255,${djFx/14})`;
      cx.beginPath(); cx.arc(vx_ + Math.cos(a)*r, vy_+PH/2 + Math.sin(a)*r, 3, 0, Math.PI*2); cx.fill();
    }
  }

  cx.save(); cx.translate(vx_, vy_);
  if (f < 0) cx.scale(-1, 1);

  if (player.onGround) {
    cx.fillStyle = "rgba(0,0,0,0.13)";
    cx.beginPath(); cx.ellipse(0,PH+2,14,5,0,0,Math.PI*2); cx.fill();
  }

  // Катушка
  cx.fillStyle = "#546e7a"; cx.beginPath(); cx.arc(-13,23,10,0,Math.PI*2); cx.fill();
  cx.strokeStyle = "#fdd835"; cx.lineWidth = 2;
  cx.beginPath(); cx.arc(-13,23,7,0,Math.PI*2); cx.stroke();
  cx.fillStyle = "#37474f"; cx.beginPath(); cx.arc(-13,23,2.5,0,Math.PI*2); cx.fill();
  cx.strokeStyle = "#fdd835"; cx.lineWidth = 3; cx.lineCap = "round";
  cx.beginPath(); cx.moveTo(-13,33); cx.lineTo(-10,40); cx.stroke();

  // Ноги
  cx.lineCap = "butt";
  for (const [ox, sgn] of [[-5,1],[5,-1]]) {
    cx.save(); cx.translate(ox,30); cx.rotate(ls*sgn*Math.PI/180);
    cx.fillStyle = "#1a237e"; cx.fillRect(-4,0,7,13);
    cx.fillStyle = "#111"; cx.fillRect(-5,11,9,6);
    cx.restore();
  }

  // Тело
  cx.fillStyle = "#1565c0"; cx.fillRect(-9,14,18,18);
  cx.fillStyle = "#e65100";
  cx.fillRect(-9,14,18,4); cx.fillRect(-9,26,18,4);
  cx.fillRect(-9,14,4,18); cx.fillRect(5,14,4,18);

  // Руки
  cx.lineCap = "round";
  for (const [ox, sgn] of [[9,1],[-9,-1]]) {
    cx.save(); cx.translate(ox,18); cx.rotate((as*sgn+15*sgn)*Math.PI/180);
    cx.strokeStyle = "#1565c0"; cx.lineWidth = 5;
    cx.beginPath(); cx.moveTo(0,0); cx.lineTo(0,13); cx.stroke();
    cx.fillStyle = "#f5cba7"; cx.beginPath(); cx.arc(0,13,3,0,Math.PI*2); cx.fill();
    cx.restore();
  }

  // Голова
  cx.fillStyle = "#f5cba7"; cx.beginPath(); cx.arc(0,8,9,0,Math.PI*2); cx.fill();
  cx.fillStyle = "#2c1a0e";
  cx.beginPath(); cx.arc(3,7,1.6,0,Math.PI*2); cx.arc(-3,7,1.6,0,Math.PI*2); cx.fill();
  cx.lineWidth = 1.5;
  if (!player.onGround) {
    cx.beginPath(); cx.arc(0,11,2.2,0,Math.PI*2); cx.fill();
  } else if (Math.abs(player.vx) > 0.8) {
    cx.strokeStyle = "#2c1a0e"; cx.beginPath(); cx.moveTo(-2.5,11); cx.lineTo(2.5,11); cx.stroke();
  } else {
    cx.strokeStyle = "#2c1a0e"; cx.beginPath(); cx.arc(0,10,2.5,0.1,Math.PI-0.1); cx.stroke();
  }

  // Каска
  cx.fillStyle = "#f9a825"; cx.beginPath(); cx.arc(0,3,11,Math.PI,0); cx.fill();
  cx.fillRect(-13,2,26,5); cx.fillStyle = "#f57f17"; cx.fillRect(-10,0,20,3);

  cx.restore();
}

// ─── HUD (без кнопок) ───────────────────────────────────────
function drawHUD() {
  cx.fillStyle = "rgba(0,0,0,0.55)"; cx.fillRect(0,0,W,26);
  cx.fillStyle = "#ffeb3b"; cx.font = "bold 13px monospace"; cx.textAlign = "left";
  cx.fillText("💰 " + score, 8, 17);
  cx.textAlign = "right";
  cx.fillText("❤️".repeat(lives), W-8, 17);

  // Иконка двойного прыжка
  const djColor = jumpsLeft === 2 ? "#69f0ae" : jumpsLeft === 1 ? "#ffb300" : "#555";
  cx.fillStyle = djColor;
  cx.font = "bold 11px monospace"; cx.textAlign = "left";
  cx.fillText("↑" + jumpsLeft, 8, H - 8);

  // Прогресс
  const pct = Math.min(1, (player.x-80) / (GOAL.x+20-80));
  cx.fillStyle = "rgba(255,255,255,0.15)"; cx.fillRect(W/2-72,7,144,11);
  cx.fillStyle = pct>0.85 ? "#69f0ae" : "#ffb300"; cx.fillRect(W/2-72,7,144*pct,11);
  cx.strokeStyle = "rgba(255,255,255,0.4)"; cx.lineWidth=1; cx.strokeRect(W/2-72,7,144,11);
  cx.fillStyle = "#fff"; cx.font = "7px monospace"; cx.textAlign = "center";
  cx.fillText("🔌 "+Math.round(pct*100)+"%", W/2, 16);

  // Подсказка жестов (исчезает через 4 сек)
  if (hintAlpha > 0) {
    const a = Math.min(1, hintAlpha / 60);
    cx.save(); cx.globalAlpha = a;
    cx.fillStyle = "rgba(0,0,0,0.55)"; cx.fillRect(0, H-22, W, 22);
    cx.fillStyle = "#fff"; cx.font = "10px sans-serif"; cx.textAlign = "center";
    cx.fillText("◀ держи левую  |  ↑ свайп вверх = прыжок  |  держи правую ▶", W/2, H-7);
    cx.restore();
  }

  // Зоны управления (очень прозрачные)
  cx.save(); cx.globalAlpha = 0.06;
  cx.fillStyle = gesture.left ? "#fff" : "#aaa"; cx.fillRect(0,26,W/2,H-26);
  cx.fillStyle = gesture.right ? "#fff" : "#aaa"; cx.fillRect(W/2,26,W/2,H-26);
  cx.restore();
}

// ─── OVERLAY / MENU ─────────────────────────────────────────
function drawOverlay(title, sub, btnText) {
  cx.fillStyle = "rgba(0,0,0,0.72)"; cx.fillRect(0,0,W,H);
  cx.fillStyle = "#fff"; cx.font = "bold 28px sans-serif"; cx.textAlign = "center";
  cx.fillText(title, W/2, H/2-44);
  cx.font = "14px sans-serif"; cx.fillStyle = "#ddd";
  cx.fillText(sub, W/2, H/2-10);
  cx.fillStyle = gstate==="win" ? "#2e7d32" : "#c62828";
  rr(W/2-88, H/2+14, 176, 46, 23); cx.fill();
  cx.fillStyle = "#fff"; cx.font = "bold 17px sans-serif";
  cx.fillText(btnText, W/2, H/2+43);
}

function drawMenu() {
  cx.fillStyle = "#1a237e"; cx.fillRect(0,0,W,H);
  for (let i=0;i<50;i++) {
    cx.fillStyle = `rgba(255,255,255,${0.15+Math.sin(fr*0.04+i)*0.1})`;
    cx.fillRect((i*113)%W, (i*79)%H, 2, 2);
  }
  cx.fillStyle = "#fdd835"; cx.font = "bold 26px monospace"; cx.textAlign = "center";
  cx.fillText("ВАЛЕРА", W/2, 52);
  cx.fillStyle = "#fff"; cx.font = "bold 14px monospace";
  cx.fillText("СЛАБОТОЧНИК", W/2, 74);
  cx.fillStyle = "#b0bec5"; cx.font = "12px sans-serif";
  cx.fillText("Протяни UTP-кабель через весь офис", W/2, 100);
  cx.fillText("Берегись Технадзора — он кидается бумагами!", W/2, 116);

  // Валера preview
  cx.save(); cx.translate(W/2, 182); cx.scale(1.3, 1.3);
  cx.fillStyle = "#1a237e"; cx.fillRect(-5,12,6,14); cx.fillRect(1,12,6,14);
  cx.fillStyle = "#111"; cx.fillRect(-6,23,8,5); cx.fillRect(1,23,8,5);
  cx.fillStyle = "#1565c0"; cx.fillRect(-9,-2,18,16);
  cx.fillStyle = "#e65100"; cx.fillRect(-9,-2,18,4); cx.fillRect(-9,10,18,4); cx.fillRect(-9,-2,4,16); cx.fillRect(5,-2,4,16);
  cx.strokeStyle = "#1565c0"; cx.lineWidth = 5; cx.lineCap = "round";
  cx.beginPath(); cx.moveTo(-9,2); cx.lineTo(-14,14); cx.stroke();
  cx.beginPath(); cx.moveTo(9,2);  cx.lineTo(14,14);  cx.stroke();
  cx.fillStyle = "#f5cba7"; cx.beginPath(); cx.arc(0,-10,9,0,Math.PI*2); cx.fill();
  cx.fillStyle = "#f9a825"; cx.beginPath(); cx.arc(0,-13,11,Math.PI,0); cx.fill(); cx.fillRect(-13,-14,26,5);
  cx.fillStyle = "#2c1a0e"; cx.beginPath(); cx.arc(3,-11,1.5,0,Math.PI*2); cx.arc(-3,-11,1.5,0,Math.PI*2); cx.fill();
  cx.strokeStyle = "#2c1a0e"; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(0,-7,2.5,0.1,Math.PI-0.1); cx.stroke();
  cx.fillStyle = "#546e7a"; cx.beginPath(); cx.arc(-13,5,9,0,Math.PI*2); cx.fill();
  cx.strokeStyle = "#fdd835"; cx.lineWidth = 2; cx.beginPath(); cx.arc(-13,5,6,0,Math.PI*2); cx.stroke();
  cx.restore();

  cx.fillStyle = "#43a047"; rr(W/2-96,228,192,48,24); cx.fill();
  cx.fillStyle = "#fff"; cx.font = "bold 20px sans-serif"; cx.textAlign = "center";
  cx.fillText("▶  ИГРАТЬ", W/2, 258);
  cx.fillStyle = "rgba(255,255,255,0.3)"; cx.font = "10px sans-serif";
  cx.fillText("Жесты: ◀ левая сторона  |  ↑ свайп вверх  |  правая ▶", W/2, 290);
}

function handleMenuClick(x, y) {
  if (gstate === "menu") {
    if (x>W/2-96 && x<W/2+96 && y>228 && y<278) initGame();
  } else if (gstate === "dead" || gstate === "win") {
    if (x>W/2-88 && x<W/2+88 && y>H/2+14 && y<H/2+62) initGame();
  }
}

cv.addEventListener("click", e => {
  const { x, y } = canvasXY(e.clientX, e.clientY);
  handleMenuClick(x, y);
});

// ─── LOOP ───────────────────────────────────────────────────
gstate = "menu"; fr = 0;
initGame(); gstate = "menu";

function loop() {
  requestAnimationFrame(loop);
  fr++;
  if (gstate === "menu") { drawMenu(); return; }
  update();
  drawBG(); drawPlatforms(); drawCheckpoints(); drawGoal();
  drawCable(); drawTies(); drawChairs(); drawInspectors(); drawValera(); drawHUD();
  if (gstate === "dead") drawOverlay("💀 ПОДКЛЮЧЕНИЕ РАЗОРВАНО", "Кабель не дотянулся... Жизней: "+lives, "🔁 НАЧАТЬ ЗАНОВО");
  if (gstate === "win")  drawOverlay("🎉 КАБЕЛЬ ПОДКЛЮЧЁН!", "Молодец, Валера! Счёт: "+score, "▶ ЕЩЁ РАЗ");
}
loop();
})();
</script>
