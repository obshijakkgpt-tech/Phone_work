<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Перетягивание человечка</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { margin:0; overflow:hidden; background:#000; touch-action:none; user-select:none; }
canvas { position:fixed; top:0; left:0; display:block; }
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
(function () {
"use strict";

const cv = document.getElementById("g");
const cx = cv.getContext("2d");
const W = 480, H = 300;
function resize(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
window.addEventListener("resize", resize); resize();
function canvasXY(clientX, clientY){ return { x: clientX*W/cv.width, y: clientY*H/cv.height }; }

// ─── CONSTANTS ──────────────────────────────────────────────
const midX = W/2, CY = 168, RANGE = 110;
const PULL = 0.040;               // сила одного тапа (к игроку, pos+)

// ─── STATE ──────────────────────────────────────────────────
let gstate, fr, pos, pullFx, aiBurst, aiBurstT, winner, rip, conf, hintA, best=0, wins=0;

function reset(){
  gstate="play"; fr=0; pos=0; pullFx=0; aiBurst=0; aiBurstT=120;
  winner=null; rip=null; conf=[]; hintA=4*60;
}

// ─── ВВОД (тап = рывок к себе) ──────────────────────────────
function pull(){
  if (gstate!=="play") return;
  pos += PULL; pullFx = Math.min(1, pullFx+0.5);
}
document.addEventListener("touchstart", e => { e.preventDefault();
  if (gstate==="play"){ for (let i=0;i<e.changedTouches.length;i++) pull(); }
  else { const p=canvasXY(e.changedTouches[0].clientX,e.changedTouches[0].clientY); if (hitBtn(p.x,p.y)) reset(); }
}, {passive:false});
cv.addEventListener("mousedown", e => {
  if (gstate==="play") pull();
  else { const p=canvasXY(e.clientX,e.clientY); if (hitBtn(p.x,p.y)) reset(); }
});
document.addEventListener("keydown", e => {
  if (e.repeat) { if (gstate==="play") pull(); return; }
  if (gstate==="play") pull(); else if (e.key===" "||e.key==="Enter") reset();
});
function hitBtn(x,y){ return x>W/2-85 && x<W/2+85 && y>H/2+36 && y<H/2+82; }

// ─── UPDATE ─────────────────────────────────────────────────
function update(){
  fr++;
  if (hintA>0) hintA--;
  pullFx *= 0.88;

  if (gstate==="play"){
    // ИИ тянет вправо (pos-), сила растёт со временем + рывки
    const ramp = 0.0036 + Math.min(0.0042, fr*0.0000028);
    if (--aiBurstT <= 0){ aiBurst = 26 + Math.floor(Math.random()*22); aiBurstT = 90 + Math.floor(Math.random()*80); }
    let ai = ramp;
    if (aiBurst>0){ aiBurst--; ai += 0.0052; }
    pos -= ai;

    if (pos >= 1){ startRip("player"); }
    else if (pos <= -1){ startRip("ai"); }
  } else if (gstate==="rip"){
    rip.t++;
    const groundY = CY+46;
    for (const pc of [rip.top, rip.bot]){
      pc.x += pc.vx; pc.y += pc.vy; pc.vy += 0.32; pc.vx *= 0.99; pc.ang += pc.av;
      if (pc.y > groundY){ pc.y = groundY; pc.vy *= -0.32; pc.vx *= 0.7; pc.av *= 0.6; }
    }
    if (Math.abs(rip.top.x - rip.bot.x) > 74) rip.snapped = true;   // кишки оборвались
    for (const b of rip.blood){ if (b.grounded) continue;
      b.x += b.vx; b.y += b.vy; b.vy += 0.4;
      if (b.y >= groundY+6){ b.y = groundY+6; b.grounded = true; rip.pool = Math.min(130, rip.pool+1.5); } }
    for (const c of conf){ c.x+=c.vx; c.y+=c.vy; c.vy+=0.18; c.ang+=c.av; c.life--; }
    conf = conf.filter(c=>c.life>0);
    if (rip.t > 96){ gstate="over"; if (winner==="player"){ wins++; } }
  }
}

function startRip(who){
  winner = who; gstate = "rip";
  const seam = midX - pos*RANGE;     // точка разрыва (пояс)
  rip = { t:0, seam, snapped:false, pool:0,
    top:{ x:seam, y:CY, vx:-3.2, vy:-3.4, ang:0, av:-0.08 },   // голова+торс+руки → влево
    bot:{ x:seam, y:CY, vx: 3.2, vy:-2.6, ang:0, av: 0.08 },   // таз+ноги → вправо
    blood:[] };
  // кровь фонтаном из разрыва
  for (let i=0;i<48;i++){ const a=-Math.PI/2+(Math.random()-0.5)*2.6, sp=2+Math.random()*7;
    rip.blood.push({ x:seam, y:CY, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1, r:2+Math.random()*3.5,
      life:60+Math.random()*40, grounded:false }); }
  // конфетти радости победителей
  for (let i=0;i<50;i++){
    conf.push({ x: midX+(Math.random()-0.5)*120, y: CY-10, vx:(Math.random()-0.5)*7, vy:-Math.random()*7-1,
      ang:Math.random()*6, av:(Math.random()-0.5)*0.4, life:60+Math.random()*40,
      c:["#e53935","#43a047","#1e88e5","#fdd835","#ab47bc","#ff7043"][i%6], s:3+Math.random()*3 });
  }
}

// ─── HELPERS ────────────────────────────────────────────────
function rr(x,y,w,h,r){ const m=Math.min(r,w/2,h/2); cx.beginPath();
  cx.moveTo(x+m,y); cx.lineTo(x+w-m,y); cx.arcTo(x+w,y,x+w,y+h,m);
  cx.lineTo(x+w,y+h-m); cx.arcTo(x+w,y+h,x,y+h,m);
  cx.lineTo(x+m,y+h); cx.arcTo(x,y+h,x,y,m);
  cx.lineTo(x,y+m); cx.arcTo(x,y,x+w,y,m); cx.closePath(); }

// ─── КОМАНДЫ ────────────────────────────────────────────────
function drawPuller(x, y, dir, col, lean, cheer){
  cx.save(); cx.translate(x,y); cx.scale(dir,1);
  if (cheer){
    // прыгает от радости, руки вверх
    cx.strokeStyle="#37474f"; cx.lineWidth=5; cx.lineCap="round";
    cx.beginPath(); cx.moveTo(-3,14); cx.lineTo(-6,26); cx.moveTo(3,14); cx.lineTo(6,26); cx.stroke();
    cx.fillStyle=col; rr(-8,-4,16,18,4); cx.fill();
    cx.strokeStyle=col; cx.lineWidth=4;
    cx.beginPath(); cx.moveTo(-7,0); cx.lineTo(-14,-12); cx.moveTo(7,0); cx.lineTo(14,-12); cx.stroke();
    cx.fillStyle="#e8b48f"; cx.beginPath(); cx.arc(-14,-12,3,0,Math.PI*2); cx.arc(14,-12,3,0,Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(0,-14,8,0,Math.PI*2); cx.fill();
    cx.fillStyle="#2c1a0e"; cx.beginPath(); cx.arc(-3,-15,1.4,0,Math.PI*2); cx.arc(3,-15,1.4,0,Math.PI*2); cx.fill();
    cx.strokeStyle="#2c1a0e"; cx.lineWidth=1.4; cx.beginPath(); cx.arc(0,-11,2.6,0.1,Math.PI-0.1); cx.stroke();
  } else {
    // тянет: откинулся назад, руки вперёд к канату
    cx.save(); cx.rotate(-lean*0.5);
    cx.strokeStyle="#37474f"; cx.lineWidth=5; cx.lineCap="round";
    cx.beginPath(); cx.moveTo(-2,14); cx.lineTo(-10,24); cx.moveTo(4,14); cx.lineTo(-2,26); cx.stroke();
    cx.fillStyle=col; rr(-8,-4,16,18,4); cx.fill();
    // руки вперёд (в сторону каната = +x в локальных)
    cx.strokeStyle=col; cx.lineWidth=4;
    cx.beginPath(); cx.moveTo(7,2); cx.lineTo(18,4); cx.moveTo(7,6); cx.lineTo(18,7); cx.stroke();
    cx.fillStyle="#e8b48f"; cx.beginPath(); cx.arc(18,4,3,0,Math.PI*2); cx.arc(18,7,3,0,Math.PI*2); cx.fill();
    // голова
    cx.fillStyle="#e8b48f"; cx.beginPath(); cx.arc(-2,-14,8,0,Math.PI*2); cx.fill();
    cx.fillStyle="#2c1a0e"; cx.beginPath(); cx.arc(1,-15,1.4,0,Math.PI*2); cx.fill();
    cx.strokeStyle="#2c1a0e"; cx.lineWidth=1.4; cx.beginPath(); cx.moveTo(-4,-10); cx.lineTo(1,-10); cx.stroke(); // напряжён
    cx.restore();
  }
  cx.restore();
}

function drawTeam(baseX, dir, col, lean, cheer){
  // 2 бойца друг за другом
  drawPuller(baseX + dir*0,  CY+44, dir, col, lean, cheer);
  drawPuller(baseX + dir*30, CY+46, dir, col, lean*0.8, cheer);
}

// ─── ЧЕЛОВЕЧЕК-КАНАТ (настоящая фигура) ─────────────────────
function drawRopeMan(){
  const seam = midX - pos*RANGE;
  const GL = 112, GRr = 368;                 // куда тянут руки (лево) и ноги (право)
  const shoulderX = seam-26, hipX = seam+18, headX = seam-44;

  // РУКИ тянутся к левой команде
  cx.strokeStyle="#e8b48f"; cx.lineWidth=8; cx.lineCap="round";
  cx.beginPath(); cx.moveTo(shoulderX,CY-6); cx.lineTo(GL,CY+22); cx.stroke();
  cx.beginPath(); cx.moveTo(shoulderX,CY+2); cx.lineTo(GL,CY+30); cx.stroke();
  cx.fillStyle="#e8b48f"; cx.beginPath(); cx.arc(GL,CY+22,5,0,Math.PI*2); cx.arc(GL,CY+30,5,0,Math.PI*2); cx.fill();
  // НОГИ тянутся к правой команде (джинсы)
  cx.strokeStyle="#3a4a8a"; cx.lineWidth=9;
  cx.beginPath(); cx.moveTo(hipX,CY-2); cx.lineTo(GRr,CY+22); cx.stroke();
  cx.beginPath(); cx.moveTo(hipX,CY+6); cx.lineTo(GRr,CY+30); cx.stroke();
  cx.fillStyle="#222"; cx.beginPath(); cx.ellipse(GRr+4,CY+22,6,4,0,0,Math.PI*2); cx.ellipse(GRr+4,CY+30,6,4,0,0,Math.PI*2); cx.fill();

  // ТОРС (рубашка) — растягивается, на поясе будущий разрыв
  cx.fillStyle="#1e88e5"; rr(shoulderX-2, CY-15, hipX-shoulderX+4, 30, 8); cx.fill();
  cx.fillStyle="#1565c0"; cx.fillRect(shoulderX-2, CY-15, hipX-shoulderX+4, 4);
  cx.fillStyle="#5d4037"; cx.fillRect(seam-3, CY+5, hipX-seam+8>0?6:6, 8);    // ремень у пояса
  cx.fillStyle="#5d4037"; cx.fillRect(seam-3, CY-15, 6, 30);                   // линия натяжения (пояс)
  // лёгкие линии натяжения кожи
  cx.strokeStyle="rgba(0,0,0,0.12)"; cx.lineWidth=1;
  cx.beginPath(); cx.moveTo(shoulderX,CY-15); cx.lineTo(hipX,CY-15); cx.moveTo(shoulderX,CY+15); cx.lineTo(hipX,CY+15); cx.stroke();

  // шея + голова
  cx.fillStyle="#e8b48f"; cx.fillRect(headX+8, CY-3, 10, 6);
  cx.beginPath(); cx.arc(headX, CY, 15, 0, Math.PI*2); cx.fill();
  cx.fillStyle="#5d4037"; cx.beginPath(); cx.arc(headX, CY-4, 15, Math.PI, 0); cx.fill();   // волосы
  // напряжённое лицо
  cx.fillStyle="#2c1a0e"; cx.beginPath(); cx.arc(headX-4,CY-2,2,0,Math.PI*2); cx.arc(headX+4,CY-2,2,0,Math.PI*2); cx.fill();
  cx.strokeStyle="#3a2a1a"; cx.lineWidth=1.2; cx.beginPath(); cx.moveTo(headX-7,CY-6); cx.lineTo(headX-2,CY-5); cx.moveTo(headX+2,CY-5); cx.lineTo(headX+7,CY-6); cx.stroke();
  cx.fillStyle="#fff"; rr(headX-5,CY+4,11,4,1); cx.fill();   // стиснутые зубы
  cx.strokeStyle="#999"; cx.lineWidth=0.6; for(let i=0;i<4;i++){ cx.beginPath(); cx.moveTo(headX-4+i*3,CY+4); cx.lineTo(headX-4+i*3,CY+8); cx.stroke(); }
  cx.fillStyle="#4fc3f7"; cx.beginPath(); cx.arc(headX-13,CY-9+Math.sin(fr*0.3)*2,1.7,0,Math.PI*2); cx.fill();  // пот
}

function drawTornEdge(ex, dir){
  // зубчатый кровавый срез на стороне dir (от -13 до 13 по y)
  cx.fillStyle="#c62828"; cx.beginPath(); cx.moveTo(ex,-13);
  for (let i=0;i<5;i++) cx.lineTo(ex+dir*(i%2?6:1), -13+i*6.5);
  cx.lineTo(ex,13); cx.closePath(); cx.fill();
  cx.fillStyle="#8e0000"; cx.beginPath(); cx.ellipse(ex+dir*2,0,3,9,0,0,Math.PI*2); cx.fill();
}
function drawGutLoops(ex, dir){
  // свисающие петли кишок
  cx.lineCap="round";
  for (let i=0;i<3;i++){
    const gx = ex + dir*(5+i*4), gy = 8 + i*4 + Math.sin(fr*0.2+i)*2;
    cx.strokeStyle="#cf6f7c"; cx.lineWidth=4; cx.beginPath(); cx.arc(gx, gy, 5, 0, Math.PI*2); cx.stroke();
    cx.strokeStyle="#a84e5b"; cx.lineWidth=1.4; cx.beginPath(); cx.arc(gx, gy, 5, 0, Math.PI*2); cx.stroke();
  }
}
function drawIntestineStrand(x1,y1,x2,y2){
  const mx=(x1+x2)/2, my=Math.max(y1,y2)+26+Math.sin(fr*0.2)*4;
  cx.strokeStyle="#cf6f7c"; cx.lineWidth=6; cx.lineCap="round";
  cx.beginPath(); cx.moveTo(x1,y1); cx.quadraticCurveTo(mx,my,x2,y2); cx.stroke();
  cx.strokeStyle="#a84e5b"; cx.lineWidth=2; cx.beginPath(); cx.moveTo(x1,y1); cx.quadraticCurveTo(mx,my,x2,y2); cx.stroke();
}

function drawRippedMan(){
  const groundY = CY+52;
  // лужа крови
  if (rip.pool>0){
    cx.fillStyle="#8a0016"; cx.beginPath(); cx.ellipse(rip.seam, groundY+4, rip.pool, rip.pool*0.16+4,0,0,Math.PI*2); cx.fill();
    cx.fillStyle="#b00020"; cx.beginPath(); cx.ellipse(rip.seam, groundY+3, rip.pool*0.7, rip.pool*0.11+3,0,0,Math.PI*2); cx.fill();
  }
  // тянущиеся кишки между половинами (пока не оборвались)
  if (!rip.snapped) drawIntestineStrand(rip.top.x+12, rip.top.y+6, rip.bot.x-12, rip.bot.y+6);

  // ВЕРХНЯЯ половина: руки + торс + голова, обрыв справа
  const t = rip.top;
  cx.save(); cx.translate(t.x, t.y); cx.rotate(t.ang);
  cx.strokeStyle="#e8b48f"; cx.lineWidth=8; cx.lineCap="round";       // руки болтаются
  cx.beginPath(); cx.moveTo(-26,-6); cx.lineTo(-46,6+Math.sin(fr*0.3)*3); cx.moveTo(-24,2); cx.lineTo(-44,16+Math.sin(fr*0.3+1)*3); cx.stroke();
  cx.fillStyle="#e8b48f"; cx.beginPath(); cx.arc(-46,6,4,0,Math.PI*2); cx.arc(-44,16,4,0,Math.PI*2); cx.fill();
  cx.fillStyle="#1e88e5"; rr(-30,-15,38,30,7); cx.fill();             // торс (рубашка)
  drawTornEdge(8,1); drawGutLoops(6,1);                              // кровавый срез + кишки
  cx.fillStyle="#e8b48f"; cx.fillRect(-42,-3,8,6);                    // шея
  cx.beginPath(); cx.arc(-44,0,14,0,Math.PI*2); cx.fill();            // голова
  cx.fillStyle="#5d4037"; cx.beginPath(); cx.arc(-44,-4,14,Math.PI,0); cx.fill();
  cx.fillStyle="#2c1a0e"; cx.font="bold 9px sans-serif"; cx.textAlign="center"; cx.fillText("X",-48,2); cx.fillText("X",-40,2);
  cx.strokeStyle="#7a3b1a"; cx.lineWidth=1.4; cx.beginPath(); cx.arc(-44,6,2.6,0,Math.PI*2); cx.stroke();
  cx.restore();

  // НИЖНЯЯ половина: таз + ноги, обрыв слева
  const b = rip.bot;
  cx.save(); cx.translate(b.x, b.y); cx.rotate(b.ang);
  cx.strokeStyle="#3a4a8a"; cx.lineWidth=9; cx.lineCap="round";       // ноги болтаются
  cx.beginPath(); cx.moveTo(20,-2); cx.lineTo(40,16+Math.sin(fr*0.3)*3); cx.moveTo(22,6); cx.lineTo(40,24+Math.sin(fr*0.3+1)*3); cx.stroke();
  cx.fillStyle="#222"; cx.beginPath(); cx.ellipse(42,16,6,4,0,0,Math.PI*2); cx.ellipse(42,24,6,4,0,0,Math.PI*2); cx.fill();
  cx.fillStyle="#3a4a8a"; rr(-8,-15,28,28,7); cx.fill();              // таз (джинсы)
  drawTornEdge(-8,-1); drawGutLoops(-6,-1);
  cx.restore();

  // брызги крови
  for (const bl of rip.blood){
    cx.fillStyle = bl.grounded ? "#7a0016" : "#d50000";
    cx.beginPath(); cx.arc(bl.x, bl.y, bl.r, 0, Math.PI*2); cx.fill();
  }
}

// ─── ФОН ────────────────────────────────────────────────────
function drawBG(){
  const sky = cx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#bfe3f5"); sky.addColorStop(1,"#e8f4ec");
  cx.fillStyle=sky; cx.fillRect(0,0,W,H);
  // трибуны вдали
  cx.fillStyle="#cfd8dc"; cx.fillRect(0,60,W,40);
  for (let i=0;i<W/10;i++){ cx.fillStyle=["#90a4ae","#b0bec5"][i%2]; cx.fillRect(i*10,64,8,32); }
  // земля/арена
  cx.fillStyle="#c8a25a"; cx.fillRect(0,CY+50,W,H-(CY+50));
  cx.fillStyle="#b58e44"; cx.fillRect(0,CY+50,W,4);
  // центральная черта и зоны победы
  cx.strokeStyle="rgba(0,0,0,0.25)"; cx.lineWidth=2; cx.setLineDash([6,6]);
  cx.beginPath(); cx.moveTo(midX, CY+10); cx.lineTo(midX, CY+50); cx.stroke(); cx.setLineDash([]);
  cx.fillStyle="rgba(67,160,71,0.18)"; cx.fillRect(0,CY+44,midX-RANGE,6);
  cx.fillStyle="rgba(229,57,53,0.18)"; cx.fillRect(midX+RANGE,CY+44,W-(midX+RANGE),6);
}

// ─── HUD ────────────────────────────────────────────────────
function drawMeter(){
  const bx=40, bw=W-80, by=30;
  cx.fillStyle="rgba(0,0,0,0.25)"; rr(bx-4,by-4,bw+8,18,9); cx.fill();
  cx.fillStyle="#43a047"; rr(bx,by,bw/2,10,5); cx.fill();
  cx.fillStyle="#e53935"; rr(bx+bw/2,by,bw/2,10,5); cx.fill();
  // метка позиции (pos: + к игроку слева)
  const t = (1 - (pos+1)/2);       // pos=1 → t=0 (лево), pos=-1 → t=1 (право)
  const mx = bx + bw*t;
  cx.fillStyle="#fff"; cx.beginPath(); cx.moveTo(mx,by-6); cx.lineTo(mx-6,by-14); cx.lineTo(mx+6,by-14); cx.fill();
  cx.fillStyle="#fff"; rr(mx-3,by-2,6,14,2); cx.fill();
  // подписи
  cx.fillStyle="#1b5e20"; cx.font="bold 10px sans-serif"; cx.textAlign="left"; cx.fillText("ТЫ", bx, by-8);
  cx.fillStyle="#b71c1c"; cx.textAlign="right"; cx.fillText("СОПЕРНИК", bx+bw, by-8);
}

function drawHUD(){
  drawMeter();
  if (gstate==="play"){
    cx.fillStyle="#1b5e20"; cx.font="bold 22px sans-serif"; cx.textAlign="center";
    cx.save(); cx.globalAlpha=0.5+pullFx*0.5;
    cx.fillText("ТЯНИ! 💪", midX, 70); cx.restore();
  }
  cx.fillStyle="#455a64"; cx.font="11px monospace"; cx.textAlign="center";
  cx.fillText("побед: "+wins, midX, H-8);

  if (hintA>0 && gstate==="play"){
    const a=Math.min(1,hintA/60); cx.save(); cx.globalAlpha=a;
    cx.fillStyle="rgba(0,0,0,0.5)"; cx.fillRect(0,H-24,W,18);
    cx.fillStyle="#fff"; cx.font="10px sans-serif"; cx.textAlign="center";
    cx.fillText("Быстро тапай по экрану — перетяни человечка на свою сторону!", midX, H-11);
    cx.restore();
  }
}

function drawBtn(label){
  cx.fillStyle="#43a047"; rr(W/2-85,H/2+36,170,46,23); cx.fill();
  cx.fillStyle="#fff"; cx.font="bold 18px sans-serif"; cx.textAlign="center";
  cx.fillText(label, W/2, H/2+65);
}
function drawMenu(){
  drawBG();
  drawTeam(70,1,"#2e7d32",0.4,false); drawTeam(410,-1,"#c62828",0.4,false);
  drawRopeMan();
  cx.fillStyle="rgba(0,0,0,0.42)"; cx.fillRect(0,0,W,H);
  cx.fillStyle="#ffeb3b"; cx.font="bold 23px sans-serif"; cx.textAlign="center";
  cx.fillText("ПЕРЕТЯГИВАНИЕ", midX, H/2-52);
  cx.fillText("ЧЕЛОВЕЧКА", midX, H/2-26);
  cx.fillStyle="#fff"; cx.font="12px sans-serif";
  cx.fillText("Тапай как бешеный и перетяни его на себя.", midX, H/2-2);
  cx.fillStyle="#ff8a80"; cx.font="11px sans-serif";
  cx.fillText("Победитель радостно разрывает беднягу пополам!", midX, H/2+16);
  drawBtn("▶  ТЯНУТЬ");
}
function drawOver(){
  cx.fillStyle="rgba(0,0,0,0.7)"; cx.fillRect(0,0,W,H);
  const win = winner==="player";
  cx.fillStyle= win?"#69f0ae":"#ff5252"; cx.font="bold 24px sans-serif"; cx.textAlign="center";
  cx.fillText(win?"🎉 ПЕРЕТЯНУЛ!":"💀 ПРОИГРАЛ!", midX, H/2-40);
  cx.fillStyle="#fff"; cx.font="14px sans-serif";
  cx.fillText(win?"Разорвал человечка в свою пользу!":"Соперник разорвал человечка!", midX, H/2-12);
  drawBtn(win?"▶ ЕЩЁ РАЗ":"🔁 РЕВАНШ");
}

// ─── LOOP ───────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  cx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  if (gstate==="menu"){ fr++; drawMenu(); return; }

  update();
  drawBG();

  if (gstate==="rip" || gstate==="over"){
    const cheer = true;
    drawTeam(70 - (winner==="player"?0:0), 1, "#2e7d32", 0, winner==="player");
    drawTeam(410, -1, "#c62828", 0, winner==="ai");
    if (rip) drawRippedMan();
    // конфетти
    for (const c of conf){ cx.save(); cx.translate(c.x,c.y); cx.rotate(c.ang); cx.fillStyle=c.c; cx.fillRect(-c.s/2,-c.s/2,c.s,c.s); cx.restore(); }
  } else {
    const lean = 0.4 + pullFx*0.5;
    drawTeam(70, 1, "#2e7d32", lean + (pos>0?0.2:0), false);
    drawTeam(410, -1, "#c62828", 0.4 + (pos<0?0.2:0), false);
    drawRopeMan();
  }

  drawHUD();
  if (gstate==="over") drawOver();
}

reset();
gstate = "menu";
loop();
})();
</script>
</body>
</html>
