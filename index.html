<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Мини-игры</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  color: #f0f0f0;
  padding: 20px;
}
h1 {
  text-align: center;
  font-size: 28px;
  letter-spacing: 3px;
  padding: 20px 0 8px;
  background: linear-gradient(90deg, #e94560, #f5a623, #e94560);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  text-align: center;
  color: #8892b0;
  font-size: 14px;
  margin-bottom: 28px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
  max-width: 900px;
  margin: 0 auto;
}
.card {
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 20px 12px 16px;
  text-align: center;
  cursor: pointer;
  transition: transform .15s, border-color .15s, background .15s;
  text-decoration: none;
  color: inherit;
  display: block;
}
.card:hover, .card:active {
  transform: translateY(-3px);
  border-color: rgba(233,69,96,0.6);
  background: rgba(233,69,96,0.08);
}
.card.soon {
  opacity: 0.38;
  cursor: default;
  pointer-events: none;
}
.card .icon { font-size: 42px; margin-bottom: 10px; display: block; }
.card .num  { font-size: 10px; color: #8892b0; margin-bottom: 4px; }
.card .name { font-size: 14px; font-weight: 600; line-height: 1.3; }
.card .tag  {
  display: inline-block;
  margin-top: 8px;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  background: rgba(99,255,132,0.15);
  color: #63ff84;
}
.card.soon .tag {
  background: rgba(255,255,255,0.08);
  color: #8892b0;
}
footer {
  text-align: center;
  margin-top: 32px;
  color: #4a5568;
  font-size: 12px;
  padding-bottom: 20px;
}
</style>
</head>
<body>
<h1>🎮 МИНИ-ИГРЫ</h1>
<p class="subtitle">Коллекция · 100 игр</p>
<div class="grid">

  <a class="card" href="games/snake/index.html">
    <span class="icon">🐍</span>
    <div class="num">#001</div>
    <div class="name">Змейка</div>
    <span class="tag">✅ Готово</span>
  </a>

  <a class="card" href="games/valera/index.html">
    <span class="icon">🔌</span>
    <div class="num">#002</div>
    <div class="name">Валера Слаботочник</div>
    <span class="tag">✅ Готово</span>
  </a>

  <a class="card" href="games/boba/index.html">
    <span class="icon">💡</span>
    <div class="num">#003</div>
    <div class="name">Боба Электрик</div>
    <span class="tag">✅ Готово</span>
  </a>

  <a class="card" href="games/alexey/index.html">
    <span class="icon">🏃</span>
    <div class="num">#004</div>
    <div class="name">Алексей и Зарплата</div>
    <span class="tag">✅ Готово</span>
  </a>

  <!-- #005–100 coming soon -->
  <div class="card soon"><span class="icon">❓</span><div class="num">#005</div><div class="name">Скоро</div><span class="tag">⏳ В разработке</span></div>
  <div class="card soon"><span class="icon">❓</span><div class="num">#006</div><div class="name">Скоро</div><span class="tag">⏳ В разработке</span></div>
  <div class="card soon"><span class="icon">❓</span><div class="num">#007</div><div class="name">Скоро</div><span class="tag">⏳ В разработке</span></div>

</div>
<footer>обновляется по мере выхода новых игр</footer>
</body>
</html>
