<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Змейка</title>
<style>
  :root {
    --skin: #e8b48f;
    --skin-dark: #d49a72;
    --burgundy: #7c1f2e;
    --burgundy-dark: #5a121e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #2b3a2b, #131a13);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    margin: 10px 0 4px;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--skin);
  }
  #scorebar {
    display: flex;
    gap: 24px;
    font-size: 16px;
    margin-bottom: 10px;
  }
  #scorebar b { color: var(--skin); }
  #wrap {
    position: relative;
  }
  canvas {
    background: #1d281d;
    border: 4px solid var(--burgundy);
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    touch-action: none;
    max-width: 92vw;
    max-height: 60vh;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(10,15,10,.78);
    border-radius: 12px;
    gap: 14px;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay p { margin: 0; font-size: 15px; max-width: 280px; line-height: 1.5; }
  button {
    background: var(--burgundy);
    color: #fff;
    border: none;
    padding: 12px 26px;
    font-size: 17px;
    border-radius: 30px;
    cursor: pointer;
    transition: transform .1s, background .2s;
  }
  button:active { transform: scale(.95); }
  button:hover { background: var(--burgundy-dark); }
  #hint { font-size: 13px; color: #9aa; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
  <h1>🐍 ЗМЕЙКА</h1>
  <div id="scorebar">
    <div>Счёт: <b id="score">0</b></div>
    <div>Рекорд: <b id="best">0</b></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay">
      <p id="msg">Управляй змейкой: собирай яблоки и расти. Не врежься в стену и в саму себя!</p>
      <button id="startBtn">Играть</button>
    </div>
  </div>
  <div id="hint">Клавиши-стрелки / WASD &nbsp;·&nbsp; на телефоне — свайпы</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const msgEl = document.getElementById("msg");
  const startBtn = document.getElementById("startBtn");

  const GRID = 20;                 // клеток по стороне
  const CELL = canvas.width / GRID; // размер клетки в пикселях

  let snake, dir, nextDir, food, score, best, alive, speed, loopTimer;

  best = Number(localStorage.getItem("snakeBest") || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = 130;
    alive = true;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    while (true) {
      const fx = Math.floor(Math.random() * GRID);
      const fy = Math.floor(Math.random() * GRID);
      if (!snake.some(s => s.x === fx && s.y === fy)) {
        food = { x: fx, y: fy };
        return;
      }
    }
  }

  function step() {
    if (!alive) return;

    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // столкновение со стеной
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) {
      return gameOver();
    }
    // столкновение с собой
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score % 5 === 0 && speed > 60) speed -= 10; // ускоряемся
      placeFood();
      schedule();
    } else {
      snake.pop();
    }

    draw();
  }

  function schedule() {
    clearTimeout(loopTimer);
    loopTimer = setTimeout(() => { step(); }, speed);
  }

  function loop() {
    step();
    if (alive) schedule();
  }

  function gameOver() {
    alive = false;
    clearTimeout(loopTimer);
    if (score > best) {
      best = score;
      localStorage.setItem("snakeBest", best);
      bestEl.textContent = best;
    }
    msgEl.innerHTML = "Игра окончена! Счёт: <b>" + score + "</b>";
    startBtn.textContent = "Ещё раз";
    overlay.classList.remove("hidden");
  }

  // ---------- РИСОВАНИЕ ----------
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // лёгкая клетчатая сетка
    ctx.fillStyle = "rgba(255,255,255,0.03)";
    for (let i = 0; i < GRID; i++) {
      for (let j = 0; j < GRID; j++) {
        if ((i + j) % 2 === 0) ctx.fillRect(i * CELL, j * CELL, CELL, CELL);
      }
    }

    drawFood();

    // тело змейки телесного/кожного цвета (от хвоста к голове)
    for (let i = snake.length - 1; i >= 1; i--) {
      drawBodySegment(snake[i], i);
    }
    drawTailFeet(); // два соединённых шарика на хвосте
    drawHead();     // бордовая овальная голова с ртом
  }

  function cellCenter(seg) {
    return { cx: seg.x * CELL + CELL / 2, cy: seg.y * CELL + CELL / 2 };
  }

  function drawBodySegment(seg, i) {
    const { cx, cy } = cellCenter(seg);
    const r = CELL * 0.42;
    const grad = ctx.createRadialGradient(cx - r/3, cy - r/3, r/4, cx, cy, r);
    grad.addColorStop(0, "#f0c4a0");
    grad.addColorStop(1, "#d49a72");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Хвост: два соединённых шарика телесного цвета (вместо «ножек»)
  function drawTailFeet() {
    if (snake.length < 2) return;
    const tail = snake[snake.length - 1];
    const prev = snake[snake.length - 2];
    const { cx, cy } = cellCenter(tail);

    // направление от хвоста наружу (противоположно движению тела)
    let dx = tail.x - prev.x;
    let dy = tail.y - prev.y;
    if (dx === 0 && dy === 0) { dx = -dir.x; dy = -dir.y; }
    // перпендикуляр, чтобы разнести два шарика в стороны
    const px = -dy, py = dx;

    const off = CELL * 0.22;
    const r = CELL * 0.26;

    // соединительная перемычка между шариками
    ctx.strokeStyle = "#d49a72";
    ctx.lineWidth = CELL * 0.18;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx + px * off, cy + py * off);
    ctx.lineTo(cx - px * off, cy - py * off);
    ctx.stroke();

    for (const s of [1, -1]) {
      const bx = cx + px * off * s;
      const by = cy + py * off * s;
      const grad = ctx.createRadialGradient(bx - r/3, by - r/3, r/4, bx, by, r);
      grad.addColorStop(0, "#f0c4a0");
      grad.addColorStop(1, "#c98a62");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(bx, by, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Голова: бордовая, овальная, со ртом посередине
  function drawHead() {
    const head = snake[0];
    const { cx, cy } = cellCenter(head);
    const angle = Math.atan2(dir.y, dir.x);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);

    const rx = CELL * 0.55; // вытянута вдоль движения — овал
    const ry = CELL * 0.42;

    // бордовый овал
    const grad = ctx.createRadialGradient(-rx/3, -ry/3, ry/4, 0, 0, rx);
    grad.addColorStop(0, "#9c2a3a");
    grad.addColorStop(1, "#5a121e");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // глаза
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(rx * 0.15, -ry * 0.45, ry * 0.22, 0, Math.PI * 2);
    ctx.arc(rx * 0.15, ry * 0.45, ry * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath();
    ctx.arc(rx * 0.22, -ry * 0.45, ry * 0.1, 0, Math.PI * 2);
    ctx.arc(rx * 0.22, ry * 0.45, ry * 0.1, 0, Math.PI * 2);
    ctx.fill();

    // рот посередине (спереди головы)
    ctx.strokeStyle = "#2a0a10";
    ctx.lineWidth = CELL * 0.08;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(rx * 0.55, -ry * 0.35);
    ctx.lineTo(rx * 0.9, 0);
    ctx.lineTo(rx * 0.55, ry * 0.35);
    ctx.stroke();

    ctx.restore();
  }

  function drawFood() {
    const { cx, cy } = cellCenter(food);
    const r = CELL * 0.35;
    ctx.fillStyle = "#d33";
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    // блик
    ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.beginPath();
    ctx.arc(cx - r/3, cy - r/3, r/4, 0, Math.PI * 2);
    ctx.fill();
    // листик
    ctx.strokeStyle = "#3a7d3a";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.lineTo(cx + r/2, cy - r * 1.4);
    ctx.stroke();
  }

  // ---------- УПРАВЛЕНИЕ ----------
  function setDir(x, y) {
    // нельзя развернуться на 180°
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  document.addEventListener("keydown", (e) => {
    switch (e.key) {
      case "ArrowUp": case "w": case "W": case "ц": case "Ц": setDir(0, -1); break;
      case "ArrowDown": case "s": case "S": case "ы": case "Ы": setDir(0, 1); break;
      case "ArrowLeft": case "a": case "A": case "ф": case "Ф": setDir(-1, 0); break;
      case "ArrowRight": case "d": case "D": case "в": case "В": setDir(1, 0); break;
      default: return;
    }
    e.preventDefault();
  }, { passive: false });

  // свайпы для телефона
  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener("touchmove", (e) => { e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > 20) setDir(dx > 0 ? 1 : -1, 0);
    } else {
      if (Math.abs(dy) > 20) setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, { passive: true });

  function startGame() {
    reset();
    overlay.classList.add("hidden");
    draw();
    schedule();
  }

  startBtn.addEventListener("click", startGame);

  // первичная отрисовка-превью
  reset();
  alive = false;
  draw();
})();
</script>
</body>
</html>
